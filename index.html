<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0918" />
  <meta name="description" content="7th Dimension — a cinematic ARMY community MVP." />
  <title>7TH DIMENSION — One space. Seven stars. One ARMY.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void: #090817;
      --void-soft: #110e24;
      --panel: rgba(18, 16, 38, .77);
      --panel-solid: #15122b;
      --panel-light: rgba(37, 32, 72, .72);
      --line: rgba(220, 215, 255, .14);
      --line-bright: rgba(176, 150, 255, .54);
      --white: #fbfaff;
      --muted: #aaa5c4;
      --dim: #777290;
      --violet: #a88cff;
      --violet-bright: #c1aeff;
      --blue: #9cbcff;
      --green: #b9e5cf;
      --danger: #ff9da9;
      --shadow: 0 30px 100px rgba(0, 0, 0, .42);
      --radius: 22px;
      --radius-small: 13px;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--void); scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--white);
      background: var(--void);
      font: 14px/1.5 Inter, system-ui, sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      background:
        radial-gradient(circle at 51% 31%, rgba(103, 78, 203, .25), transparent 25rem),
        radial-gradient(circle at 7% 94%, rgba(66, 73, 155, .12), transparent 22rem),
        radial-gradient(circle at 94% 9%, rgba(173, 118, 255, .12), transparent 24rem),
        var(--void);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      opacity: .55;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 0 1px, transparent 1.6px),
        radial-gradient(circle, rgba(184,164,255,.7) 0 1px, transparent 1.8px),
        radial-gradient(circle, rgba(255,255,255,.6) 0 1px, transparent 1.5px);
      background-position: 9% 18%, 23% 70%, 77% 12%;
      background-size: 230px 190px, 310px 270px, 420px 360px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--violet-bright);
      outline-offset: 3px;
    }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3, .brand-name, .display-name { font-family: "Space Grotesk", sans-serif; }
    h1 { letter-spacing: -.07em; }
    h2 { letter-spacing: -.04em; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .eyebrow {
      color: var(--violet-bright);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .text-button, .icon-button, .nav-button, .chip, .primary-button, .ghost-button {
      border: 0;
      color: inherit;
      background: transparent;
    }

    /* Shared brand */
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--white);
      text-decoration: none;
    }
    .brand-mark {
      position: relative;
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      color: var(--white);
    }
    .brand-mark::before, .brand-mark::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border: 1px solid currentColor;
      border-radius: 5px;
      transform: rotate(30deg);
    }
    .brand-mark::after { transform: rotate(90deg); opacity: .45; }
    .brand-mark span { width: 4px; height: 4px; z-index: 1; border-radius: 50%; background: currentColor; }
    .brand-name { font-size: 14px; font-weight: 700; letter-spacing: .12em; }

    /* Portal */
    .portal {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      isolation: isolate;
    }
    .portal-reference {
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .065;
      background:
        linear-gradient(180deg, rgba(7, 5, 17, .24), rgba(9, 8, 23, .95)),
        url("attached_assets/Screenshot_2026-09-06_123254_1788698170494.png") center / cover no-repeat;
      filter: saturate(.8) blur(.2px);
      pointer-events: none;
    }
    .portal-header {
      width: min(1100px, calc(100% - 56px));
      margin: 0 auto;
      padding: 18px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .portal-header .brand-mark { width: 24px; height: 24px; color: #bab0ff; }
    .portal-header .brand-mark::before, .portal-header .brand-mark::after { width: 16px; height: 16px; }
    .portal-header .brand-name { font-size: 13px; }
    .portal-links { display: flex; align-items: center; gap: 28px; }
    .portal-link {
      position: relative;
      padding: 4px 0;
      color: var(--muted);
      font-size: 12px;
      text-decoration: none;
    }
    .portal-link:hover, .portal-link.active { color: var(--white); }
    .portal-link.active::after {
      content: "";
      position: absolute;
      right: 0; bottom: -8px; left: 0;
      height: 1px;
      background: var(--white);
      box-shadow: 0 0 10px var(--violet-bright);
    }
    .join-button {
      padding: 7px 22px;
      border: 1px solid rgba(255,255,255,.64);
      border-radius: 99px;
      color: #0c0a16;
      background: var(--white);
      box-shadow: 0 7px 18px rgba(0,0,0,.2);
      font-size: 11px;
      font-weight: 700;
    }
    .join-button:hover { color: var(--white); background: transparent; }
    .portal-main {
      flex: 1;
      position: relative;
      width: min(1120px, calc(100% - 36px));
      margin: 0 auto;
      display: grid;
      place-items: center;
      padding: 45px 0 30px;
      text-align: center;
    }
    .orbit-system {
      position: absolute;
      width: min(620px, 84vw);
      aspect-ratio: 1;
      border: 1px solid rgba(161, 139, 255, .18);
      border-radius: 50%;
      box-shadow: 0 0 100px rgba(104, 73, 222, .13), inset 0 0 90px rgba(113, 88, 221, .08);
      transform: rotate(-17deg);
      pointer-events: none;
    }
    .orbit-system::before, .orbit-system::after {
      content: "";
      position: absolute;
      inset: 11%;
      border: 1px solid rgba(171, 150, 255, .17);
      border-radius: 50%;
    }
    .orbit-system::after { inset: 26%; border-color: rgba(210, 200, 255, .21); transform: rotate(68deg) scaleX(1.5); }
    .orbit-dot {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #e7e0ff;
      box-shadow: 0 0 12px 3px rgba(203, 188, 255, .9);
    }
    .dot-a { top: 10%; left: 31%; }
    .dot-b { top: 20%; right: 18%; background: var(--violet-bright); }
    .dot-c { top: 47%; right: 4%; }
    .dot-d { bottom: 14%; right: 25%; }
    .dot-e { bottom: 20%; left: 17%; background: var(--blue); }
    .dot-f { top: 54%; left: 7%; }
    .dot-g { top: 28%; left: 47%; background: var(--violet-bright); }
    .portal-content { position: relative; z-index: 1; }
    .portal-content h1 {
      max-width: 820px;
      margin: 0 auto;
      color: var(--white);
      font-size: clamp(48px, 9vw, 105px);
      line-height: .9;
      text-transform: uppercase;
      text-shadow: 0 0 45px rgba(159, 131, 255, .24);
    }
    .portal-content h1 span {
      display: block;
      color: #c2b0ff;
      font-size: .57em;
      letter-spacing: -.04em;
      margin-bottom: 9px;
    }
    .portal-tagline {
      margin: 26px 0 31px;
      color: #bcb6d6;
      font-size: clamp(11px, 1.7vw, 14px);
      font-weight: 600;
      letter-spacing: .28em;
      text-transform: uppercase;
    }
    .portal-actions { display: flex; justify-content: center; gap: 13px; }
    .primary-button, .ghost-button {
      min-height: 44px;
      padding: 0 25px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      transition: .25s ease;
    }
    .primary-button {
      color: #0b0916;
      background: var(--white);
      box-shadow: 0 0 28px rgba(215, 204, 255, .16);
    }
    .primary-button:hover { transform: translateY(-2px); box-shadow: 0 0 36px rgba(194, 174, 255, .35); }
    .ghost-button { border: 1px solid rgba(193, 174, 255, .66); color: var(--white); }
    .ghost-button:hover { background: rgba(181, 159, 255, .12); transform: translateY(-2px); }
    .portal-footer {
      width: min(1100px, calc(100% - 36px));
      margin: 0 auto;
      padding-bottom: 15px;
    }
    .feature-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 18px 0;
      border-top: 1px solid rgba(255,255,255,.1);
      border-bottom: 1px solid rgba(255,255,255,.09);
    }
    .feature {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #bdb8d5;
      font-size: 11px;
    }
    .feature i {
      width: 12px;
      height: 12px;
      display: inline-block;
      border: 1px solid var(--violet-bright);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(173, 149, 255, .4);
    }
    .portal-status {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 3px 0;
      color: var(--dim);
      font-size: 10px;
      letter-spacing: .06em;
    }
    .portal-status b { color: #aaa3c9; font-weight: 500; }

    /* App shell */
    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 225px minmax(0, 1fr);
      background:
        linear-gradient(90deg, rgba(6, 5, 14, .54), transparent 33%),
        radial-gradient(circle at 75% 10%, rgba(105, 77, 221, .12), transparent 35rem);
    }
    .sidebar {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 30px;
      padding: 22px 15px 16px;
      border-right: 1px solid var(--line);
      background: rgba(9, 8, 22, .78);
      backdrop-filter: blur(18px);
    }
    .sidebar .brand { padding: 0 9px; }
    .sidebar .brand-mark { color: var(--violet-bright); }
    .nav-label {
      margin: 0 11px 8px;
      color: var(--dim);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .nav-list { display: grid; gap: 4px; }
    .nav-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 11px;
      border: 1px solid transparent;
      border-radius: 11px;
      color: var(--muted);
      text-align: left;
      transition: .2s ease;
    }
    .nav-button:hover, .nav-button.active {
      color: var(--white);
      border-color: var(--line-bright);
      background: rgba(157, 129, 255, .1);
    }
    .nav-button.active .nav-icon { color: var(--violet-bright); }
    .nav-icon { width: 17px; color: #807b9d; font-size: 16px; text-align: center; }
    .sidebar-spacer { flex: 1; }
    .mini-profile {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255,255,255,.035);
      text-align: left;
    }
    .avatar {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 12px;
      color: #130d2c;
      background: linear-gradient(145deg, #dfd5ff, #8e74e8);
      font: 700 12px "Space Grotesk", sans-serif;
    }
    .avatar.small { width: 30px; height: 30px; border-radius: 10px; font-size: 10px; }
    .avatar.blue { background: linear-gradient(145deg, #d9e4ff, #7599ef); }
    .avatar.green { background: linear-gradient(145deg, #d8f6e7, #78c4a1); }
    .avatar.gold { background: linear-gradient(145deg, #fff0c7, #d4a553); }
    .avatar.pink { background: linear-gradient(145deg, #ffe0ee, #c481af); }
    .mini-profile-copy { min-width: 0; }
    .mini-profile-copy strong, .mini-profile-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini-profile-copy strong { font-size: 12px; }
    .mini-profile-copy span { margin-top: 2px; color: var(--muted); font-size: 10px; }
    .main-wrap { min-width: 0; }
    .topbar {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 clamp(18px, 4vw, 45px);
      border-bottom: 1px solid var(--line);
      background: rgba(9, 8, 22, .44);
      backdrop-filter: blur(18px);
    }
    .mobile-menu { display: none; }
    .page-heading h2 { font-size: 20px; }
    .page-heading p { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }
    .search {
      width: min(235px, 23vw);
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      background: rgba(255,255,255,.035);
    }
    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      color: var(--white);
      background: transparent;
      font-size: 12px;
    }
    .search input::placeholder { color: var(--dim); }
    .icon-button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      background: rgba(255,255,255,.035);
      transition: .2s ease;
    }
    .icon-button:hover { color: var(--white); border-color: var(--line-bright); }
    .content {
      width: min(1110px, 100%);
      margin: 0 auto;
      padding: 30px clamp(18px, 4vw, 45px) 90px;
    }
    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(250px, .8fr);
      gap: 20px;
      align-items: start;
    }
    .stack { display: grid; gap: 16px; }
    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 15px 40px rgba(0,0,0,.13);
      backdrop-filter: blur(18px);
    }
    .composer { padding: 18px; }
    .composer-head { display: flex; align-items: center; gap: 11px; }
    .composer-input {
      width: 100%;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: 0;
      color: var(--white);
      background: rgba(255,255,255,.035);
    }
    .composer-input::placeholder { color: var(--muted); }
    .composer-input:focus { border-color: var(--line-bright); box-shadow: 0 0 0 3px rgba(169,140,255,.1); }
    .composer-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 13px;
      padding-left: 42px;
    }
    .tool-button {
      padding: 6px 9px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
    }
    .tool-button:hover { color: var(--white); border-color: var(--line); background: rgba(255,255,255,.04); }
    .post-button { margin-left: auto; padding: 8px 15px; border-radius: 9px; }
    .section-tabs {
      display: flex;
      gap: 20px;
      padding: 0 3px 12px;
      border-bottom: 1px solid var(--line);
    }
    .section-tab {
      position: relative;
      padding: 0;
      border: 0;
      color: var(--muted);
      background: none;
      font-size: 12px;
    }
    .section-tab.active { color: var(--white); }
    .section-tab.active::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -13px;
      left: 0;
      height: 2px;
      background: var(--violet-bright);
      box-shadow: 0 0 10px var(--violet);
    }
    .post-card { padding: 19px; }
    .post-meta { display: flex; align-items: center; gap: 10px; }
    .post-author { min-width: 0; flex: 1; }
    .post-author strong { display: block; font-size: 12px; }
    .post-author span { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; }
    .more-button { padding: 0 5px; border: 0; color: var(--muted); background: none; font-size: 18px; }
    .more-button:hover { color: var(--white); }
    .post-menu {
      position: absolute;
      top: 44px;
      right: 17px;
      z-index: 3;
      min-width: 150px;
      display: grid;
      gap: 3px;
      padding: 6px;
      border: 1px solid var(--line-bright);
      border-radius: 12px;
      background: #15122b;
      box-shadow: var(--shadow);
    }
    .post-menu button {
      padding: 8px 10px;
      border: 0;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
      text-align: left;
    }
    .post-menu button:hover { color: var(--white); background: rgba(255,255,255,.07); }
    .post-menu button.danger { color: var(--danger); }
    .post-card { position: relative; }
    .thread-list { display: grid; gap: 11px; margin-top: 16px; }
    .thread-item { padding: 11px 12px; border: 1px solid var(--line); border-radius: 11px; background: rgba(255,255,255,.025); }
    .thread-item.reply { margin-left: 22px; }
    .thread-item p { margin-top: 5px; color: #dedbf0; font-size: 12px; white-space: pre-wrap; }
    .thread-meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 10px; }
    .thread-meta strong { color: var(--white); font-size: 11px; }
    .thread-tools { display: flex; gap: 8px; margin-top: 7px; }
    .thread-tools button { padding: 0; border: 0; color: var(--violet-bright); background: none; font-size: 10px; }
    .settings-grid { display: grid; gap: 13px; margin-top: 20px; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .setting-row:last-child { border-bottom: 0; }
    .setting-row select { max-width: 180px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; color: var(--white); background: rgba(255,255,255,.06); }
    .post-body { padding: 15px 0 6px 42px; }
    .post-body p { color: #dedbf0; font-size: 13px; line-height: 1.7; }
    .post-body .tag { color: var(--violet-bright); }
    .post-image {
      width: calc(100% - 42px);
      max-height: 300px;
      margin: 13px 0 10px 42px;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .post-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 0 0 42px;
      border-top: 1px solid rgba(255,255,255,.07);
    }
    .action-button {
      padding: 5px 9px;
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
    }
    .action-button:hover { color: var(--white); background: rgba(255,255,255,.06); }
    .action-button.active { color: var(--violet-bright); }
    .action-button.save { margin-left: auto; }
    .side-card { padding: 18px; }
    .card-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .card-heading h3 { font-size: 15px; }
    .card-heading p { margin-top: 4px; }
    .card-link { padding: 0; border: 0; color: var(--violet-bright); background: none; font-size: 11px; }
    .signal-line {
      height: 1px;
      margin: 16px 0;
      background: linear-gradient(90deg, var(--violet), transparent);
      opacity: .5;
    }
    .trend-list, .event-list, .member-list { display: grid; gap: 13px; margin-top: 16px; }
    .trend-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .trend-row strong { display: block; color: var(--white); font-size: 12px; font-weight: 600; }
    .trend-row span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
    .rank { color: var(--violet-bright); font: 600 12px "Space Grotesk", sans-serif; }
    .event-row { display: flex; gap: 11px; }
    .event-date {
      width: 38px;
      height: 42px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid rgba(173,149,255,.35);
      border-radius: 9px;
      color: var(--violet-bright);
      background: rgba(159,131,255,.09);
      font: 700 11px/1.1 "Space Grotesk", sans-serif;
      text-align: center;
      text-transform: uppercase;
    }
    .event-row strong { display: block; font-size: 11px; font-weight: 600; }
    .event-row span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .online-dot { color: var(--green); }
    .view { animation: view-in .4s ease both; }
    @keyframes view-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Secondary views */
    .hero-card {
      position: relative;
      overflow: hidden;
      padding: 28px;
      background:
        radial-gradient(circle at 85% 20%, rgba(164,137,255,.25), transparent 17rem),

  <div id="modal-root"></div>

  <div id="tour-root"></div>
  <div id="command-root"></div>

  <script type="text/plain" id="legacy-mvp-code">
    (() => {
      "use strict";

      const load = (key, fallback) => {
        try {
          const saved = localStorage.getItem(key);
          return saved ? JSON.parse(saved) : fallback;
        } catch { return fallback; }
      };
      const save = (key, value) => {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
      };

      const seedPosts = [
        {
          id: "p1",
          initials: "RM",
          avatar: "blue",
          author: "moonchild.archive",
          role: "FEATURED ARMY",
          time: "18 min ago",
          text: "The moon is full tonight and somehow the whole sky feels like a new chapter. Leaving this signal here for whoever needs a little light. <span class=\"tag\">#ARMY</span> <span class=\"tag\">#7THDIMENSION</span>",
          likes: 287,
          comments: 34,
          liked: false,
          saved: false
        },
        {
          id: "p2",
          initials: "TH",
          avatar: "gold",
          author: "tae_in_the_stars",
          role: "ARMY",
          time: "1 hr ago",
          text: "Our birthday project constellation is open. Seven small acts of kindness, one connected orbit. Add your country in the comments so we can watch the points light up.",
          likes: 164,
          comments: 19,
          liked: true,
          saved: true
        },
        {
          id: "p3",
          initials: "AG",
          avatar: "green",
          author: "purplewave.seoul",
          role: "ARMY",
          time: "3 hrs ago",
          text: "Found a beautiful thread in the archive about the first era. The memories we keep really do become a map.",
          likes: 92,
          comments: 11,
          liked: false,
          saved: false
        }
      ];

      const state = {
        view: "flow",
        filter: "Following",
        query: "",
        user: { name: "JoonieK", bio: "still with you, across every dimension.", xp: 240 },
        posts: load("dimension-posts", seedPosts),
        signals: 3,
        joined: load("dimension-joined", ["core"]),
        attending: load("dimension-events", [])
      };

      const $ = (selector, scope = document) => scope.querySelector(selector);
      const $$ = (selector, scope = document) => [...scope.querySelectorAll(selector)];
      const escapeHTML = (value) => String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[char]));
      const pageMeta = {
        flow: ["Flow", "Your orbit, in motion."],
        constellation: ["Constellation", "Find the communities that feel like home."],
        discover: ["Discover", "Follow the signals worth keeping."],
        signal: ["Signal", "Nothing important should pass unseen."],
        archive: ["Archive", "Your saved memories, held in one place."],
        events: ["Events", "Meet at the next point in the orbit."],
        messages: ["Messages", "Private channels between stars."],
        profile: ["Profile", "Your place in the constellation."]
      };

      function toast(message) {
        const root = $("#toast-root");
        root.innerHTML = `<div class="toast">${escapeHTML(message)}</div>`;
        window.clearTimeout(toast.timer);
        toast.timer = window.setTimeout(() => { root.innerHTML = ""; }, 3000);
      }

      function openModal(type) {
        const isJoin = type === "join";
        $("#modal-root").innerHTML = `
          <div class="modal-backdrop" data-close-modal>
            <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
              <button class="modal-close" data-close-modal aria-label="Close dialog">×</button>
              <div class="eyebrow">${isJoin ? "Begin your orbit" : "Return to the dimension"}</div>
              <h2 id="modal-title">${isJoin ? "Join the ARMY constellation" : "Log in to your space"}</h2>
              <p>${isJoin ? "Create a local MVP identity and make your first signal." : "This prototype keeps your session in this browser only."}</p>
              <form class="form" id="identity-form">
                ${isJoin ? `<div class="field"><label for="identity-name">Display name</label><input id="identity-name" name="name" maxlength="24" placeholder="e.g. JoonieK" required /></div>` : ""}
                <div class="field"><label for="identity-email">Email</label><input id="identity-email" type="email" placeholder="you@example.com" required /></div>
                <div class="field"><label for="identity-password">Passphrase</label><input id="identity-password" type="password" placeholder="Any local demo passphrase" required /></div>
                <div class="modal-actions">
                  <button type="button" class="ghost-button" data-close-modal>Cancel</button>
                  <button type="submit" class="primary-button">${isJoin ? "Enter the dimension" : "Continue"}</button>
                </div>
              </form>
            </section>
          </div>`;
        $("#identity-form").addEventListener("submit", (event) => {
          event.preventDefault();
          const name = $("#identity-name")?.value.trim();
          if (name) {
            state.user.name = name;
            save("dimension-user", state.user);
            $("#mini-name").textContent = name;
          }
          $("#modal-root").innerHTML = "";
          enterDimension();
          toast(isJoin ? "Your constellation is ready." : "Welcome back to the dimension.");
        });
      }

      function enterDimension() {
        $("#portal").classList.add("hidden");
        $("#app").classList.remove("hidden");
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function render() {
        const [title, subtitle] = pageMeta[state.view];
        $("#page-title").textContent = title;
        $("#page-subtitle").textContent = subtitle;
        $$(".nav-button, .mobile-nav button").forEach((button) => {
          button.classList.toggle("active", button.dataset.view === state.view);
        });
        const renderer = renderers[state.view] || renderFlow;
        $("#view-container").innerHTML = renderer();
        $("#view-container").classList.remove("view");
        requestAnimationFrame(() => $("#view-container").classList.add("view"));
        bindViewEvents();
      }

      function postTemplate(post) {
        return `
          <article class="card post-card" data-post="${post.id}">
            <div class="post-meta">
              <span class="avatar ${post.avatar || ""}">${escapeHTML(post.initials)}</span>
              <div class="post-author"><strong>${escapeHTML(post.author)}</strong><span>${escapeHTML(post.role)} · ${escapeHTML(post.time)}</span></div>
              <button class="more-button" aria-label="More post actions">···</button>
            </div>
            <div class="post-body"><p>${post.text}</p></div>
            ${post.image ? `<img class="post-image" src="${escapeHTML(post.image)}" alt="Attached image from ${escapeHTML(post.author)}" />` : ""}
            <div class="post-actions">
              <button class="action-button ${post.liked ? "active" : ""}" data-post-action="like">♡ ${post.likes}</button>
              <button class="action-button" data-post-action="comment">◌ ${post.comments}</button>
              <button class="action-button" data-post-action="share">↗ Share</button>
              <button class="action-button save ${post.saved ? "active" : ""}" data-post-action="save">${post.saved ? "▣ Saved" : "▱ Save"}</button>
            </div>
          </article>`;
      }

      function renderFlow() {
        const visible = state.posts.filter((post) => {
          const haystack = `${post.author} ${post.text}`.toLowerCase();
          return !state.query || haystack.includes(state.query.toLowerCase());
        });
        return `
          <div class="content-grid">
            <section class="stack">
              <div class="card composer">
                <div class="composer-head"><span class="avatar">JK</span><input class="composer-input" id="composer-input" maxlength="320" placeholder="Send a signal to the ARMY..." /></div>
                <div class="composer-tools">
                  <button class="tool-button" id="add-image">▧ Image</button>
                  <button class="tool-button" id="add-tag"># Tag</button>
                  <button class="primary-button post-button" id="post-button">Transmit</button>
                </div>
              </div>
              <div class="section-tabs">${["Following", "Recommended", "Latest"].map((tab) => `<button class="section-tab ${state.filter === tab ? "active" : ""}" data-filter="${tab}">${tab}</button>`).join("")}</div>
              <div class="stack" id="post-list">${visible.length ? visible.map(postTemplate).join("") : `<div class="card empty-state"><strong>No signals found.</strong><p>Try a different search through the dimension.</p></div>`}</div>
            </section>
            <aside class="side-column">
              <section class="card side-card">
                <div class="card-heading"><div><div class="eyebrow">Live pulse</div><h3 style="margin-top:6px">Trending signals</h3></div><button class="card-link" data-view="discover">View all</button></div>
                <div class="signal-line"></div>
                <div class="trend-list">
                  <div class="trend-row"><div><strong>#PROOF_OF_SOUND</strong><span>2.4k signals</span></div><b class="rank">01</b></div>
                  <div class="trend-row"><div><strong>#ARMY_PROJECTS</strong><span>1.8k signals</span></div><b class="rank">02</b></div>
                  <div class="trend-row"><div><strong>#SEVEN_STARS</strong><span>946 signals</span></div><b class="rank">03</b></div>
                </div>
              </section>
              <section class="card side-card">
                <div class="card-heading"><div><div class="eyebrow">Next orbit</div><h3 style="margin-top:6px">Upcoming events</h3></div><button class="card-link" data-view="events">All events</button></div>
                <div class="event-list">
                  <div class="event-row"><div class="event-date">SEP<br>12</div><div><strong>Letters across the sky</strong><span>Global project · <span class="online-dot">● online</span></span></div></div>
                  <div class="event-row"><div class="event-date">SEP<br>21</div><div><strong>Archive night: chapter one</strong><span>Core community · 8:00 PM</span></div></div>
                </div>
              </section>
            </aside>
          </div>`;
      }

      function renderConstellation() {
        const communities = [
          ["core", "7TH DIMENSION", "The central chamber for announcements, projects, and shared orbit.", "12.4k ARMYs", "violet"],
          ["stream", "STREAMING CONSTELLATION", "Coordinate listening parties and keep every signal moving.", "4.8k ARMYs", "blue"],
          ["creative", "CREATIVE ARMY", "A quiet corner for art, writing, edits, and beautiful things.", "2.1k ARMYs", "pink"],
          ["global", "GLOBAL PROJECTS", "Many countries. One intention. Find the next mission.", "7.6k ARMYs", "green"]
        ];
        return `
          <div class="stack">
            <section class="hero-card card"><div class="eyebrow">Community universe</div><h1>Find your constellation.</h1><p>Every community is a point of light. Join the conversations that pull you closer.</p></section>
            <div class="cards-grid">${communities.map(([id, name, description, count]) => `
              <article class="card community-card">
                <div class="eyebrow">✧ active constellation</div><h3>${name}</h3><p>${description}</p>
                <div class="community-foot"><span>${count}</span><button class="card-link" data-community="${id}">${state.joined.includes(id) ? "Joined ✓" : "Join orbit →"}</button></div>
              </article>`).join("")}</div>
          </div>`;
      }

      function renderDiscover() {
        return `
          <div class="stack">
            <section class="hero-card card"><div class="eyebrow">Curated for your orbit</div><h1>There is more beyond the horizon.</h1><p>Explore the people, projects, and conversations lighting up 7th Dimension today.</p></section>
            <div class="content-grid">
              <section class="card side-card"><div class="card-heading"><div><div class="eyebrow">Now resonating</div><h3 style="margin-top:6px">Active ARMYs</h3></div></div><div class="member-list">
                ${[["SL","seoul.light","blue","1.2k"],["PJ","purple.journey","pink","860"],["OT","orbitingtae","gold","644"]].map(([initials, name, color, followers]) => `<div class="trend-row"><div style="display:flex;align-items:center;gap:9px"><span class="avatar small ${color}">${initials}</span><div><strong>${name}</strong><span>${followers} signals shared</span></div></div><button class="card-link" data-follow="${name}">Follow</button></div>`).join("")}
              </div></section>
              <section class="card side-card"><div class="card-heading"><div><div class="eyebrow">Shared intention</div><h3 style="margin-top:6px">Featured mission</h3></div><span class="eyebrow">+120 XP</span></div><div class="signal-line"></div><h3>Letters across the sky</h3><p class="muted" style="margin-top:7px;font-size:12px;line-height:1.65">Write one sentence to a fellow ARMY and help fill the global archive with light.</p><button class="primary-button" style="margin-top:18px;padding:0 16px" data-action="mission">Join mission</button></section>
            </div>
          </div>`;
      }

      function renderEvents() {
        const events = [
          ["SEP", "12", "Letters across the sky", "Global project · 8:00 PM", "1,247"],
          ["SEP", "21", "Archive night: chapter one", "7TH DIMENSION · 8:00 PM", "742"],
          ["OCT", "03", "Purple planet listening room", "Streaming constellation · 6:30 PM", "389"]
        ];
        return `<div class="stack"><section class="hero-card card"><div class="eyebrow">Save the date</div><h1>Meet at the next point.</h1><p>Small gatherings become memories when we arrive together.</p></section><section class="card side-card"><div class="event-list" style="margin-top:0">${events.map(([month, day, title, details, people], index) => `<div class="event-row" style="padding:16px 0;border-bottom:1px solid var(--line)"><div class="event-date">${month}<br>${day}</div><div style="flex:1"><strong style="font-size:13px">${title}</strong><span>${details} · ${people} attending</span></div><button class="${state.attending.includes(index) ? "ghost-button" : "primary-button"}" style="min-height:34px;padding:0 13px" data-event="${index}">${state.attending.includes(index) ? "Going ✓" : "Join"}</button></div>`).join("")}</div></section></div>`;
      }

      function renderSignal() {
        return `<div class="stack"><section class="hero-card card"><div class="eyebrow">Central notification array</div><h1>Signals received.</h1><p>Three new moments are waiting in your orbit. Everything else is already archived.</p></section><section class="card side-card"><div class="trend-list" style="margin-top:0">
          <div class="event-row"><span class="avatar small blue">PJ</span><div><strong>purple.journey reacted to your signal</strong><span>8 minutes ago · “♡”</span></div></div>
          <div class="event-row"><span class="avatar small gold">TA</span><div><strong>tae_in_the_stars invited you to a project</strong><span>31 minutes ago · Letters across the sky</span></div></div>
          <div class="event-row"><span class="avatar small green">7D</span><div><strong>7TH DIMENSION published a new announcement</strong><span>1 hour ago · Core community</span></div></div>
        </div><button class="ghost-button" style="margin-top:20px;padding:0 16px" data-action="read-signals">Mark all as read</button></section></div>`;
      }

      function renderArchive() {
        const savedPosts = state.posts.filter((post) => post.saved);
        return `<div class="stack"><section class="hero-card card"><div class="eyebrow">Personal vault</div><h1>Keep what moves you.</h1><p>Your saved posts and moments stay close, ready whenever you want to return.</p></section><div class="stack">${savedPosts.length ? savedPosts.map(postTemplate).join("") : `<section class="card empty-state"><strong>Your archive is waiting.</strong><p>Save a signal from Flow and it will appear here.</p></section>`}</div></div>`;
      }

      function renderMessages() {
        return `<div class="content-grid"><section class="card side-card"><div class="card-heading"><div><div class="eyebrow">Private channels</div><h3 style="margin-top:6px">Messages</h3></div><button class="icon-button" aria-label="New message">+</button></div><div class="member-list">
          ${[["SL","seoul.light","blue","You: see you in the next orbit","2m"],["PJ","purple.journey","pink","The archive idea is beautiful","1h"],["OT","orbitingtae","gold","Project update attached","3h"]].map(([i,n,c,m,t]) => `<button class="trend-row" style="width:100%;border:0;background:transparent;text-align:left"><div style="display:flex;align-items:center;gap:9px"><span class="avatar small ${c}">${i}</span><div><strong>${n}</strong><span>${m}</span></div></div><span>${t}</span></button>`).join("")}
        </div></section><section class="card empty-state"><strong>Choose a channel.</strong><p>Private conversations will appear here.</p></section></div>`;
      }

      function renderProfile() {
        return `<div class="profile-view"><section class="profile-banner"><div class="profile-info"><span class="avatar">JK</span><div><h1>${escapeHTML(state.user.name)}</h1><p>@${escapeHTML(state.user.name.toLowerCase())} · ARMY since 2026</p></div></div></section><section class="card stats-card"><div class="stat"><strong>${state.posts.filter((post) => post.author === state.user.name).length}</strong><span>Signals</span></div><div class="stat"><strong>7</strong><span>Constellations</span></div><div class="stat"><strong>${state.user.xp}</strong><span>XP earned</span></div></section><section class="card side-card"><div class="eyebrow">Your transmission</div><h3 style="margin-top:8px">${escapeHTML(state.user.bio)}</h3><p class="muted" style="margin-top:8px;font-size:12px">Your constellation is beginning to take shape. Keep showing up with intention.</p><button class="ghost-button" style="margin-top:18px;padding:0 16px" data-action="edit-profile">Edit profile</button></section></div>`;
      }

      const renderers = { flow: renderFlow, constellation: renderConstellation, discover: renderDiscover, signal: renderSignal, archive: renderArchive, events: renderEvents, messages: renderMessages, profile: renderProfile };

      function setView(view) {
        if (!renderers[view]) return;
        state.view = view;
        render();
      }

      function bindViewEvents() {
        $$(".section-tab").forEach((button) => button.addEventListener("click", () => {
          state.filter = button.dataset.filter;
          render();
        }));
        $("#post-button")?.addEventListener("click", createPost);
        $("#composer-input")?.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) createPost();
        });
        $("#add-tag")?.addEventListener("click", () => {
          const input = $("#composer-input");
          input.value = `${input.value}${input.value ? " " : ""}#ARMY `;
          input.focus();
        });
        $("#add-image")?.addEventListener("click", () => toast("Image uploads are queued for the full build. Your signal can still be transmitted."));
        $$("[data-post-action]").forEach((button) => button.addEventListener("click", () => handlePostAction(button)));
        $$("[data-community]").forEach((button) => button.addEventListener("click", () => {
          const id = button.dataset.community;
          state.joined = state.joined.includes(id) ? state.joined.filter((item) => item !== id) : [...state.joined, id];
          save("dimension-joined", state.joined);
          toast(state.joined.includes(id) ? "You joined the constellation." : "You left the constellation.");
          render();
        }));
        $$("[data-event]").forEach((button) => button.addEventListener("click", () => {
          const id = Number(button.dataset.event);
          state.attending = state.attending.includes(id) ? state.attending.filter((item) => item !== id) : [...state.attending, id];
          save("dimension-events", state.attending);
          toast(state.attending.includes(id) ? "Event added to your orbit." : "Event removed from your orbit.");
          render();
        }));
        $$("[data-follow]").forEach((button) => button.addEventListener("click", () => {
          button.textContent = button.textContent === "Following" ? "Follow" : "Following";
          toast(button.textContent === "Following" ? `Following ${button.dataset.follow}.` : `Muted ${button.dataset.follow}.`);
        }));

        if (options.limit) query = query.limit(options.limit);
        if (options.eq) Object.entries(options.eq).forEach(([column, value]) => { query = query.eq(column, value); });
        if (options.in) Object.entries(options.in).forEach(([column, values]) => { query = query.in(column, values); });
        return query;

          <div class="post-body"><p>${post.text || "<span class=\"muted\">Empty signal</span>"}</p></div>
          ${post.image ? `<img class="post-image" src="${escapeHTML(post.image)}" alt="Image attached by ${escapeHTML(post.author)}" />` : ""}
          <div class="post-actions"><button class="action-button ${post.liked ? "active" : ""}" data-post-action="like">♡ ${post.likes}</button><button class="action-button" data-post-action="comment">◌ ${post.comments}</button><button class="action-button" data-post-action="share">↗ Share</button><button class="action-button save ${post.saved ? "active" : ""}" data-post-action="save">${post.saved ? "▣ Saved" : "▱ Save"}</button></div>
        </article>`;
      }

      function empty(title, detail) {
        return `<div class="card empty-state"><strong>${escapeHTML(title)}</strong><p>${escapeHTML(detail)}</p></div>`;
      }

      function renderFlow() {
        const hydrated = state.posts.map(hydratePost).filter((post) => !state.query || `${post.author} ${post.text}`.toLowerCase().includes(state.query.toLowerCase()));
        const postList = hydrated.length ? hydrated.map(postTemplate).join("") : empty("No live signals yet.", "When someone posts to the connected database, it will appear here.");
        const query = state.query.toLowerCase();
        const searchProfiles = state.profiles.filter((profile) => `${displayName(profile)} ${profile.username || ""}`.toLowerCase().includes(query));
        const searchCommunities = state.communities.filter((community) => `${community.name || ""} ${community.description || ""}`.toLowerCase().includes(query));
        const searchProjects = state.projects.filter((project) => `${project.title || project.name || ""} ${project.description || ""}`.toLowerCase().includes(query));
        const searchEvents = state.events.filter((event) => `${event.title || event.name || ""} ${event.description || ""}`.toLowerCase().includes(query));
        const searchHashtags = [...new Set(state.posts.flatMap((post) => String(post.content || post.body || post.text || "").match(/#[\w-]+/g) || []))].filter((tag) => tag.toLowerCase().includes(query));
        const searchPanel = state.query ? `<section class="card side-card"><div class="eyebrow">Global search</div><h3 style="margin-top:6px">Results for “${escapeHTML(state.query)}”</h3><div class="trend-list">${searchProfiles.slice(0, 5).map((profile) => `<div class="trend-row"><span>ARMY · ${escapeHTML(displayName(profile))}</span><span>@${escapeHTML(profile.username || "army")}</span></div>`).join("")}${searchCommunities.slice(0, 5).map((community) => `<div class="trend-row"><span>COMMUNITY · ${escapeHTML(community.name || "Unnamed")}</span><span>Constellation</span></div>`).join("")}${searchProjects.slice(0, 5).map((project) => `<div class="trend-row"><span>PROJECT · ${escapeHTML(project.title || project.name || "Untitled")}</span><span>Project</span></div>`).join("")}${searchEvents.slice(0, 5).map((event) => `<div class="trend-row"><span>EVENT · ${escapeHTML(event.title || event.name || "Untitled")}</span><span>Event</span></div>`).join("")}${searchHashtags.slice(0, 8).map((tag) => `<div class="trend-row"><span>HASHTAG · ${escapeHTML(tag)}</span><span>Post tag</span></div>`).join("")}${!searchProfiles.length && !searchCommunities.length && !searchProjects.length && !searchEvents.length && !searchHashtags.length && !hydrated.length ? `<div class="empty-state" style="padding:22px 0"><strong>No matching records.</strong><p>Search uses only data visible to your account.</p></div>` : ""}</div></section>` : "";
        const liveCommunity = state.communities[0];
        return `<div class="stack">${searchPanel}<div class="content-grid"><section class="stack">
          <div class="card composer"><div class="composer-head"><span class="avatar ${escapeHTML(currentAvatar())}">${escapeHTML(initials(currentName()))}</span><input class="composer-input" id="composer-input" maxlength="320" placeholder="Send a signal to the ARMY..." /></div><div class="composer-tools"><button class="tool-button" id="add-image">▧ Image</button><button class="tool-button" id="add-tag"># Tag</button><button class="primary-button post-button" id="post-button">Transmit</button></div></div>
          <div class="section-tabs">${["Following", "Recommended", "Latest"].map((tab) => `<button class="section-tab ${state.filter === tab ? "active" : ""}" data-filter="${tab}">${tab}</button>`).join("")}</div>
          <div class="stack" id="post-list">${postList}</div>
        </section><aside class="side-column">
          <section class="card side-card"><div class="card-heading"><div><div class="eyebrow">Live database</div><h3 style="margin-top:6px">Current pulse</h3></div><button class="card-link" data-view="discover">Discover</button></div><div class="signal-line"></div>${state.posts.length ? `<div class="trend-list"><div class="trend-row"><div><strong>${state.posts.length} stored signals</strong><span>Loaded from public.posts</span></div><b class="rank">LIVE</b></div><div class="trend-row"><div><strong>${state.profiles.length} visible profiles</strong><span>Loaded from public.profiles</span></div><b class="rank">ARMY</b></div></div>` : empty("No activity yet.", "The pulse will appear when the database has records.")}</section>
          <section class="card side-card"><div class="card-heading"><div><div class="eyebrow">Connected orbit</div><h3 style="margin-top:6px">Community</h3></div><button class="card-link" data-view="constellation">All</button></div><div class="event-list">${liveCommunity ? `<div class="event-row"><div class="event-date">✧</div><div><strong>${escapeHTML(liveCommunity.name || "Unnamed community")}</strong><span>${escapeHTML(liveCommunity.description || "No description in database.")}</span></div></div>` : `<div class="empty-state">No communities exist in the connected database.</div>`}</div></section>
         </aside></div></div>`;
      }

      function renderConstellation() {
        const cards = state.communities.map((community) => {
          const count = state.communityMembers.filter((member) => String(member.community_id) === String(community.id)).length;
          const joined = state.communityMembers.some((member) => String(member.community_id) === String(community.id) && String(member.user_id) === String(state.user.id));
          const isMain = community.is_main === true || community.is_main === "true" || /main\s*stage/i.test(community.name || "");
          return `<article class="card community-card">${isMain ? `<span class="community-open-badge">Main Stage · Open to all</span>` : `<div class="eyebrow">${escapeHTML(community.category || "community")}</div>`}<h3>${escapeHTML(community.name || "Unnamed community")}</h3><p>${escapeHTML(community.description || "No description in database.")}</p><div class="community-foot"><span>${isMain ? "Unlimited public membership" : `${count} member${count === 1 ? "" : "s"}`}</span>${isMain ? `<button class="card-link" data-open-main-stage="${escapeHTML(community.id)}">Enter stage →</button>` : `<button class="card-link" data-community="${escapeHTML(community.id)}">${joined ? "Joined ✓" : "Join orbit →"}</button>`}</div></article>`;
        }).join("");
        return `<div class="stack"><section class="hero-card card"><div class="eyebrow">Live community universe</div><h1>Find your constellation.</h1><p>Only communities returned by Supabase are shown here. Main Stage is the open community; membership and messaging still come from the connected database.</p>${canCreateCommunity() ? `<button class="primary-button" style="margin-top:18px" data-action="create-community">＋ Create community</button>` : ""}</section><div class="cards-grid">${cards || empty("No communities yet.", "Create the first community in the connected database.")}</div></div>`;
      }

      function renderDiscover() {
        const profiles = state.profiles.filter((profile) => String(profile.id) !== String(state.user.id));
        const profileRows = profiles.map((profile) => {
          const follows = state.follows.some((follow) => String(follow.follower_id || follow.user_id) === String(state.user.id) && String(follow.following_id || follow.target_user_id) === String(profile.id));
          const featured = profile.is_featured === true;
          const adminTools = isAdmin() ? `<span class="admin-tools">${featured ? `<span class="featured-mark">Featured ARMY</span>` : ""}<button class="card-link" data-feature-profile="${escapeHTML(profile.id)}">${featured ? "Unfeature" : "Feature"}</button></span>` : "";
          return `<div class="trend-row"><div style="display:flex;align-items:center;gap:9px"><span class="avatar small ${escapeHTML(profile.avatar_color || "blue")}">${escapeHTML(initials(displayName(profile)))}</span><div><strong>${escapeHTML(displayName(profile))}</strong><span>@${escapeHTML(profile.username || "army")} · ${escapeHTML(profile.role || "user")}</span></div></div><div>${adminTools}<button class="card-link" data-follow="${escapeHTML(profile.id)}">${follows ? "Following" : "Follow"}</button></div></div>`;
        }).join("");
        return `<div class="stack"><section class="hero-card card"><div class="eyebrow">${isAdmin() ? "Admin discovery" : "Database discovery"}</div><h1>There is more beyond the horizon.</h1><p>Profiles shown here are read directly from public.profiles. ${isAdmin() ? "As admin, you can feature real ARMYs; the change is written to Supabase." : "If the table is empty, this space stays empty."}</p></section><section class="card side-card"><div class="card-heading"><div><div class="eyebrow">Visible accounts</div><h3 style="margin-top:6px">ARMY directory</h3></div><span class="eyebrow">${profiles.length} found</span></div><div class="member-list">${profileRows || empty("No other profiles are visible.", "Invite someone through Supabase Auth to see a real member here.")}</div></section></div>`;
      }

      function renderEvents() {
        const rows = state.events.map((event) => {
          const dateValue = event.starts_at || event.start_at || event.date || event.event_date;
          const date = dateValue ? new Date(dateValue) : null;
          const validDate = date && !Number.isNaN(date.getTime());
          const joined = state.eventAttendees.some((item) => String(item.event_id) === String(event.id));
          const count = event.attendee_count ?? event.attendees_count ?? state.eventAttendees.filter((item) => String(item.event_id) === String(event.id)).length;
          return `<div class="event-row" style="padding:16px 0;border-bottom:1px solid var(--line)"><div class="event-date">${validDate ? escapeHTML(new Intl.DateTimeFormat(undefined, { month: "short" }).format(date).toUpperCase()) : "DATE"}<br>${validDate ? date.getDate() : "—"}</div><div style="flex:1"><strong style="font-size:13px">${escapeHTML(event.title || event.name || "Untitled event")}</strong><span>${escapeHTML(event.description || "")} · ${validDate ? escapeHTML(formatTime(dateValue)) : "Time not set"} · ${escapeHTML(String(count))} attending</span></div><button class="${joined ? "ghost-button" : "primary-button"}" style="min-height:34px;padding:0 13px" data-event="${escapeHTML(event.id)}">${joined ? "Going ✓" : "Join"}</button></div>`;
        }).join("");
        return `<div class="stack"><section class="hero-card card"><div class="eyebrow">Database events</div><h1>Meet at the next point.</h1><p>Dates, organizers, descriptions, and attendance come from the connected database.</p></section><section class="card side-card"><div class="event-list" style="margin-top:0">${rows || empty("No events configured.", "The connected database does not currently expose any events.")}</div></section></div>`;
      }

      function renderProjects() {
        const rows = state.projects.map((project) => `<article class="card side-card"><div class="card-heading"><div><div class="eyebrow">${escapeHTML(project.status || "Project")}</div><h3 style="margin-top:6px">${escapeHTML(project.title || project.name || "Untitled project")}</h3></div></div><p class="muted" style="margin-top:9px;font-size:12px">${escapeHTML(project.description || "No description in database.")}</p><div class="signal-line"></div><div class="trend-row"><span>${escapeHTML(project.goal || "Goal not set")}</span><strong>${escapeHTML(String(project.progress ?? 0))}${project.progress != null ? "%" : ""}</strong></div></article>`).join("");
        return `<div class="stack"><section class="hero-card card"><div class="eyebrow">ARMY projects</div><h1>Build something together.</h1><p>Projects shown here are records returned by Supabase, with no placeholder progress or participants.</p></section><div class="cards-grid">${rows || empty("No projects configured.", "Projects will appear when the database has project records.")}</div></div>`;
      }

      function renderMissions() {
        const rows = state.missions.map((mission) => `<article class="card side-card"><div class="card-heading"><div><div class="eyebrow">Active mission</div><h3 style="margin-top:6px">${escapeHTML(mission.title || mission.name || "Untitled mission")}</h3></div><span class="featured-mark">+${escapeHTML(String(mission.xp_reward ?? mission.reward_xp ?? 0))} XP</span></div><p class="muted" style="margin-top:9px;font-size:12px">${escapeHTML(mission.description || "No description in database.")}</p><div class="signal-line"></div><div class="trend-row"><span>Progress</span><strong>${escapeHTML(String(mission.progress ?? 0))}${mission.progress != null ? "%" : ""}</strong></div></article>`).join("");
        return `<div class="stack"><section class="hero-card card"><div class="eyebrow">Missions + XP</div><h1>Keep the orbit moving.</h1><p>Mission progress and rewards are read from your connected database.</p></section><div class="cards-grid">${rows || empty("No missions configured.", "Missions will appear when the database has mission records.")}</div></div>`;
      }

      function renderSignal() {
        const rows = state.notifications.map((notification) => {
          const actor = profileFor(notification.actor_id || notification.user_id || notification.sender_id);
          return `<div class="event-row"><span class="avatar small ${escapeHTML(actor?.avatar_color || "blue")}">${escapeHTML(initials(displayName(actor, "SIGNAL")))}</span><div><strong>${escapeHTML(notification.title || notification.message || notification.content || "New signal")}</strong><span>${escapeHTML(formatTime(notification.created_at))}</span></div></div>`;
        }).join("");
        return `<div class="stack"><section class="hero-card card"><div class="eyebrow">Central notification array</div><h1>Signals received.</h1><p>These are notifications returned by public.notifications for your signed-in account.</p></section><section class="card side-card"><div class="trend-list" style="margin-top:0">${rows || empty("No signals detected.", "Your notification stream is empty.")}</div>${state.notifications.length ? `<button class="ghost-button" style="margin-top:20px;padding:0 16px" data-action="read-signals">Mark all as read</button>` : ""}</section></div>`;
      }

      function renderArchive() {
        const saved = state.posts.map(hydratePost).filter((post) => post.saved);
        return `<div class="stack"><section class="hero-card card"><div class="eyebrow">Personal vault</div><h1>Keep what moves you.</h1><p>Only records linked to your account through public.bookmarks appear here.</p></section>${state.capabilities.bookmarks === false ? empty("Archive is not configured.", "The connected database does not expose a bookmarks table.") : saved.length ? `<div class="stack">${saved.map(postTemplate).join("")}</div>` : empty("Your archive is empty.", "Save a live signal from Flow to place it here.")}</div>`;
      }

      function renderMessages() {
        const ownConversationIds = new Set(state.conversationParticipants.map((item) => String(item.conversation_id)));
        const conversations = state.conversations.filter((conversation) => ownConversationIds.has(String(conversation.id))).filter((conversation) => {
          if (!state.conversationQuery) return true;
          const participantIds = state.conversationParticipants
            .filter((item) => String(item.conversation_id) === String(conversation.id))
            .map((item) => item.user_id);
          const other = profileFor(participantIds.find((id) => String(id) !== String(state.user.id)));
          return `${displayName(other, conversation.title || "Private conversation")} ${other?.username || ""}`.toLowerCase().includes(state.conversationQuery.toLowerCase());
        });
        const allConversations = state.conversations.filter((conversation) => ownConversationIds.has(String(conversation.id)));
        const rows = conversations.map((conversation) => {
          const participantIds = state.conversationParticipants
            .filter((item) => String(item.conversation_id) === String(conversation.id))
            .map((item) => item.user_id)
            .filter((id) => String(id) !== String(state.user.id));
          const other = profileFor(participantIds[0]);
          const latest = [...state.messages].reverse().find((message) => String(message.conversation_id) === String(conversation.id));
          const participant = state.conversationParticipants.find((item) => String(item.conversation_id) === String(conversation.id) && String(item.user_id) === String(state.user.id));
          const unread = Number(participant?.unread_count || 0) || state.messages.filter((message) => String(message.conversation_id) === String(conversation.id) && String(message.sender_id || message.user_id || message.author_id) !== String(state.user.id) && message.read !== true && message.read_at == null).length;
          const online = other?.online_status === "online" || other?.is_online === true || other?.online === true;
          return `<button class="conversation-row ${String(conversation.id) === String(state.selectedConversationId) ? "active" : ""}" data-conversation="${escapeHTML(conversation.id)}"><span style="position:relative"><span class="avatar small ${escapeHTML(other?.avatar_color || "blue")}">${escapeHTML(initials(displayName(other, "ARMY")))}</span>${online ? `<i class="status-dot online" style="position:absolute;right:-2px;bottom:-1px;border:2px solid #0b1120"></i>` : ""}</span><span class="conversation-copy"><strong>${escapeHTML(displayName(other, conversation.title || "Private conversation"))}</strong><span class="conversation-username">@${escapeHTML(other?.username || "army")}</span><span class="conversation-preview">${escapeHTML(latest?.content || latest?.body || "No messages yet")}</span></span><span class="conversation-meta"><span>${latest ? escapeHTML(formatTime(latest.created_at)) : ""}</span>${unread ? `<b class="unread-dot">${unread > 9 ? "9+" : unread}</b>` : ""}</span></button>`;
        }).join("");
        const active = allConversations.find((conversation) => String(conversation.id) === String(state.selectedConversationId));
        const activeMessages = active ? state.messages.filter((message) => String(message.conversation_id) === String(active.id)) : [];
        const activeOtherId = active && state.conversationParticipants.find((item) => String(item.conversation_id) === String(active.id) && String(item.user_id) !== String(state.user.id))?.user_id;
        const activeOther = profileFor(activeOtherId);
        const thread = activeMessages.map((message) => {
          const author = profileFor(message.sender_id || message.user_id || message.author_id);
          const sent = String(message.sender_id || message.user_id || message.author_id) === String(state.user.id);
          return `<div class="chat-message ${sent ? "sent" : ""}"><span class="avatar small ${escapeHTML(author?.avatar_color || (sent ? currentAvatar() : "blue"))}">${escapeHTML(initials(displayName(author, sent ? currentName() : "ARMY")))}</span><div class="chat-bubble"><p>${escapeHTML(message.content || message.body || message.message || "")}</p><span class="chat-time">${escapeHTML(formatTime(message.created_at))}</span></div></div>`;
        }).join("");
        const composer = active ? `<div class="chat-composer"><button class="composer-icon" data-action="attach-message" aria-label="Attach a file">＋</button><textarea id="private-message-input" rows="1" maxlength="1000" placeholder="Transmit a message..." aria-label="Message text"></textarea><button class="composer-icon" data-action="emoji-message" aria-label="Add symbol">✦</button><button class="composer-send" id="send-private-message" aria-label="Send message">↗</button></div>` : "";
        const chatContent = active ? `<header class="chat-header"><button class="chat-back" data-action="back-to-conversations" aria-label="Back to conversations">←</button><span class="avatar ${escapeHTML(activeOther?.avatar_color || "blue")}">${escapeHTML(initials(displayName(activeOther, "ARMY")))}</span><span class="chat-header-copy"><strong>${escapeHTML(displayName(activeOther, active.title || "Private conversation"))}</strong><span>@${escapeHTML(activeOther?.username || "army")} · <i class="status-dot ${activeOther?.online_status === "online" || activeOther?.is_online === true ? "online" : ""}"></i> ${activeOther?.online_status === "online" || activeOther?.is_online === true ? "active now" : "offline"}</span></span><button class="chat-options" data-action="conversation-options" aria-label="Conversation options">···</button></header><div class="chat-body" id="chat-body">${thread || `<div class="message-empty"><div class="message-empty-inner"><div class="empty-orbit"><i></i><i></i><i></i><i></i></div><h3>ENTER THE SIGNAL</h3><p>Transmit the first message in this private channel.</p></div></div>`}</div>${composer}` : `<div class="message-empty"><div class="message-empty-inner"><div class="empty-orbit"><i></i><i></i><i></i><i></i></div><h3>ENTER THE SIGNAL</h3><p>Select a conversation to begin transmitting.</p></div></div>`;
        return `<div class="messages-view ${active ? "chat-open" : ""}"><section class="conversation-panel"><div class="conversation-heading"><div><h3>MESSAGES</h3><p>${allConversations.length} private channel${allConversations.length === 1 ? "" : "s"}</p></div><button class="new-message-button" data-action="new-conversation" aria-label="New private conversation">+</button></div><label class="conversation-search" aria-label="Search conversations"><span>⌕</span><input id="conversation-search-input" type="search" value="${escapeHTML(state.conversationQuery)}" placeholder="Search conversations" /></label><div class="conversation-list">${rows || empty(state.conversationQuery ? "No conversations found." : "No private conversations yet.", state.conversationQuery ? "Try another name or username." : "Start a secure channel with another visible ARMY.")}</div></section><section class="chat-panel">${chatContent}</section></div>`;
      }

      function renderProfile() {
        const ownPosts = state.posts.filter((post) => String(post.author_id || post.user_id || post.owner_id) === String(state.user.id)).length;
        const ownCommunities = state.communityMembers.filter((member) => String(member.user_id) === String(state.user.id)).length;
        const achievements = state.achievements.map((achievement) => `<span class="chip" style="padding:7px 10px;border:1px solid var(--line);border-radius:99px;color:var(--violet-bright);font-size:10px">${escapeHTML(achievement.name || achievement.title || "Achievement")}</span>`).join("");
        return `<div class="profile-view"><section class="profile-banner"><div class="profile-info"><span class="avatar ${escapeHTML(currentAvatar())}">${escapeHTML(initials(currentName()))}</span><div><h1>${escapeHTML(currentName())}</h1><p>@${escapeHTML(state.profile?.username || "army")} · ${escapeHTML(state.profile?.role || "user")}</p></div></div></section><section class="card stats-card"><div class="stat"><strong>${ownPosts}</strong><span>Signals</span></div><div class="stat"><strong>${ownCommunities}</strong><span>Communities</span></div><div class="stat"><strong>${state.achievements.length}</strong><span>Achievements</span></div></section><section class="card side-card"><div class="eyebrow">ARMY ORBIT</div><h3 style="margin-top:8px">Your constellation is ${ownCommunities ? "taking shape." : "waiting for its first point."}</h3><p class="muted" style="margin-top:8px;font-size:12px">The orbit is based on your real memberships, posts, follows, and notifications.</p><div style="position:relative;height:58px;margin-top:17px;overflow:hidden;border:1px solid var(--line);border-radius:13px;background:radial-gradient(circle at 50% 50%,rgba(168,140,255,.2),transparent 35%),rgba(255,255,255,.02)"><span class="orbit-dot dot-a"></span><span class="orbit-dot dot-b"></span><span class="orbit-dot dot-c"></span><span class="orbit-dot dot-d"></span><span class="orbit-dot dot-e"></span><span class="orbit-dot dot-f"></span><span class="orbit-dot dot-g"></span></div><div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap"><button class="ghost-button" style="padding:0 16px" data-action="edit-profile">Edit profile</button><button class="ghost-button" style="padding:0 16px" data-action="replay-tour">Replay tour</button><button class="ghost-button" style="padding:0 16px" data-action="logout">Log out</button></div></section><section class="card side-card"><div class="eyebrow">Achievements</div><h3 style="margin-top:8px">Earned in the real orbit</h3><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:15px">${achievements || `<span class="muted" style="font-size:12px">No achievements recorded yet.</span>`}</div></section></div>`;
      }

      const renderers = { flow: renderFlow, constellation: renderConstellation, discover: renderDiscover, signal: renderSignal, archive: renderArchive, events: renderEvents, projects: renderProjects, missions: renderMissions, messages: renderMessages, profile: renderProfile };

      async function createPost() {
        const input = $("#composer-input");
        const content = input?.value.trim();
        if (!content) return toast("Write a signal before transmitting.", true);
        const candidates = [
          { author_id: state.user.id, content },
          { user_id: state.user.id, content },
          { author_id: state.user.id, body: content }
        ];
        let result = null;
        for (const payload of candidates) {
          result = await db.from("posts").insert(payload);
          if (!result.error) break;
          if (!/column|schema cache|null value/i.test(result.error.message || "")) break;
        }
        if (result?.error) return safeError("Signal transmission", result.error);
        await loadLiveData();
        toast("Signal transmitted to Supabase.");
      }

      async function toggleLike(post) {
        const existing = state.reactions.find((reaction) => String(reaction.post_id || reaction.target_id || reaction.content_id) === String(post.id) && String(reaction.user_id) === String(state.user.id) && (!reaction.type || reaction.type === "like" || reaction.reaction_type === "like"));
        if (existing) {
          let query = db.from("reactions").delete().eq("user_id", state.user.id);
          if (existing.post_id) query = query.eq("post_id", post.id);
          else query = query.eq("target_id", post.id);
          const result = await query;
          if (result.error) return safeError("Reaction update", result.error);
        } else {
          let result = await db.from("reactions").insert({ post_id: post.id, user_id: state.user.id, type: "like" });
          if (result.error && /column|schema cache/i.test(result.error.message || "")) result = await db.from("reactions").insert({ post_id: post.id, user_id: state.user.id, reaction_type: "like" });
          if (result.error) return safeError("Reaction update", result.error);
        }
        await loadLiveData();
      }

      async function addComment(post) {
        openCommentsModal(post);
      }

      async function saveComment(postId, content, parentId = null) {
        const payloads = [
          { post_id: postId, user_id: state.user.id, content, parent_id: parentId },
          { post_id: postId, author_id: state.user.id, body: content, parent_id: parentId },
          { post_id: postId, user_id: state.user.id, content },
          { post_id: postId, author_id: state.user.id, body: content }
        ];
        let result;
        for (const payload of payloads) {
          result = await db.from("comments").insert(payload);
          if (!result.error) break;
          if (!/column|schema cache|null value/i.test(result.error.message || "")) break;
        }
        if (result?.error) return safeError("Comment", result.error);
        await loadLiveData();
        toast(parentId ? "Reply added to the live thread." : "Comment added to the live thread.");
      }

      function openCommentsModal(post) {
        const comments = state.comments.filter((comment) => String(comment.post_id || comment.target_id) === String(post.id));
        const rows = comments.map((comment) => {
          const author = profileFor(comment.user_id || comment.author_id);
          const owner = String(comment.user_id || comment.author_id) === String(state.user.id);
          const parent = comment.parent_id || comment.parent_comment_id;
          return `<div class="thread-item ${parent ? "reply" : ""}" data-comment="${escapeHTML(comment.id)}">
            <div class="thread-meta"><strong>${escapeHTML(displayName(author, "ARMY"))}</strong><span>${escapeHTML(formatTime(comment.created_at))}</span></div>
            <p>${escapeHTML(comment.content || comment.body || comment.text || "")}</p>
            <div class="thread-tools"><button data-comment-reply="${escapeHTML(comment.id)}">Reply</button>${owner ? `<button data-comment-edit="${escapeHTML(comment.id)}">Edit</button><button data-comment-delete="${escapeHTML(comment.id)}">Delete</button>` : ""}<button data-comment-report="${escapeHTML(comment.id)}">Report</button></div>
          </div>`;
        }).join("");
        $("#modal-root").innerHTML = `<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true" aria-labelledby="comments-title">
          <button class="modal-close" data-close-modal aria-label="Close dialog">×</button><div class="eyebrow">Live thread</div><h2 id="comments-title">Responses to ${escapeHTML(post.author)}</h2>
          <div class="thread-list">${rows || `<div class="empty-state" style="padding:22px 0"><strong>No responses yet.</strong><p>Start the conversation around this signal.</p></div>`}</div>
          <form class="form" id="comment-form"><div class="field"><label for="comment-input">Add a comment</label><textarea id="comment-input" maxlength="1000" required placeholder="Write a thoughtful response..."></textarea></div><div class="modal-actions"><button type="button" class="ghost-button" data-close-modal>Close</button><button type="submit" class="primary-button">Transmit</button></div></form>
        </section></div>`;
        $("#comment-form").addEventListener("submit", async (event) => {
          event.preventDefault();
          const input = $("#comment-input");
          const content = input.value.trim();
          if (!content) return;
          await saveComment(post.id, content, input.dataset.parentId || null);
          openCommentsModal(hydratePost(state.posts.find((item) => String(item.id) === String(post.id))));
        });
        $$("[data-comment-reply]").forEach((button) => button.addEventListener("click", () => {
          $("#comment-input").focus();
          $("#comment-input").dataset.parentId = button.dataset.commentReply;
        }));
        $$("[data-comment-edit]").forEach((button) => button.addEventListener("click", () => editComment(post, button.dataset.commentEdit)));
        $$("[data-comment-delete]").forEach((button) => button.addEventListener("click", () => deleteComment(post, button.dataset.commentDelete)));
        $$("[data-comment-report]").forEach((button) => button.addEventListener("click", () => reportContent("comment", button.dataset.commentReport)));
      }

      async function editComment(post, commentId) {
        const comment = state.comments.find((item) => String(item.id) === String(commentId));
        if (!comment) return;
        const content = window.prompt("Edit your comment", comment.content || comment.body || comment.text || "");
        if (!content?.trim()) return;
        let result = await db.from("comments").update({ content: content.trim() }).eq("id", commentId).eq("user_id", state.user.id);
        if (result.error && /column|schema cache/i.test(result.error.message || "")) result = await db.from("comments").update({ body: content.trim() }).eq("id", commentId).eq("author_id", state.user.id);
        if (result.error) return safeError("Comment edit", result.error);
        await loadLiveData();
        openCommentsModal(hydratePost(state.posts.find((item) => String(item.id) === String(post.id))));
      }

      async function deleteComment(post, commentId) {
        let result = await db.from("comments").delete().eq("id", commentId).eq("user_id", state.user.id);
        if (result.error && /column|schema cache/i.test(result.error.message || "")) result = await db.from("comments").delete().eq("id", commentId).eq("author_id", state.user.id);
        if (result.error) return safeError("Comment deletion", result.error);
        await loadLiveData();
        openCommentsModal(hydratePost(state.posts.find((item) => String(item.id) === String(post.id))));
      }

      async function reportContent(type, contentId) {
        const payloads = [
          { reporter_id: state.user.id, target_type: type, target_id: contentId, reason: "Reported from 7TH DIMENSION" },
          { user_id: state.user.id, type, target_id: contentId, reason: "Reported from 7TH DIMENSION" }
        ];
        let result;
        for (const payload of payloads) {
          result = await db.from("reports").insert(payload);
          if (!result.error) break;
          if (!/column|schema cache|null value/i.test(result.error.message || "")) break;
        }
        if (result?.error) return safeError("Report", result.error);
        toast("Report submitted for moderation.");
      }

      function openPostMenu(button) {
        const card = button.closest("[data-post]");
        const raw = state.posts.find((item) => String(item.id) === String(card.dataset.post));
        const post = hydratePost(raw);
        card.querySelector(".post-menu")?.remove();
        const owner = String(post.authorId) === String(state.user.id);
        card.insertAdjacentHTML("beforeend", `<div class="post-menu">
          ${owner ? `<button data-post-menu-action="edit">Edit signal</button><button class="danger" data-post-menu-action="delete">Delete signal</button>` : ""}
          <button data-post-menu-action="report">Report signal</button>
        </div>`);
