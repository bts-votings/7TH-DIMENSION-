        $("#portal").classList.add("hidden");
        $("#app").classList.remove("hidden");
        connectRealtime();
        await loadLiveData();
        maybeShowTour();
        toast("Live connection established.");
      }

      function openAuthModal(mode = "login") {
        const join = mode === "join";
        $("#modal-root").innerHTML = `
          <div class="modal-backdrop" data-close-modal>
            <section class="modal" role="dialog" aria-modal="true" aria-labelledby="auth-title">
              <button class="modal-close" data-close-modal aria-label="Close dialog">×</button>
              <div class="eyebrow">${join ? "Begin your orbit" : "Return to the dimension"}</div>
              <h2 id="auth-title">${join ? "Join the ARMY constellation" : "Enter your space"}</h2>
              <p>${join ? "This creates a real Supabase account. Nothing is stored only in this browser." : "Use the email and password attached to your Supabase account."}</p>
              <form class="form" id="auth-form">
                ${join ? `<div class="field"><label for="auth-name">Display name</label><input id="auth-name" maxlength="32" placeholder="Your ARMY name" required /></div>` : ""}
                <div class="field"><label for="auth-email">Email</label><input id="auth-email" type="email" autocomplete="email" required /></div>
                <div class="field"><label for="auth-password">Password</label><input id="auth-password" type="password" autocomplete="${join ? "new-password" : "current-password"}" minlength="6" required /></div>
                ${join ? "" : `<button type="button" class="text-button" id="reset-password" style="justify-self:start;color:var(--violet-bright);font-size:11px">Forgot password?</button>`}
                <p id="auth-error" class="muted" style="min-height:18px"></p>
                <div class="modal-actions">
                  <button type="button" class="ghost-button" data-close-modal>Cancel</button>
                  <button type="submit" class="primary-button">${join ? "Create account" : "Log in"}</button>
                </div>
              </form>
            </section>
          </div>`;
        $("#auth-form").addEventListener("submit", async (event) => {
          event.preventDefault();
          const submit = event.submitter;
          submit.disabled = true;
          const email = $("#auth-email").value.trim();
          const password = $("#auth-password").value;
          let result;
          if (join) {
            const username = $("#auth-name").value.trim();
            result = await db.auth.signUp({ email, password, options: { data: { username } } });
          } else {
            result = await db.auth.signInWithPassword({ email, password });
          }
          submit.disabled = false;
          if (result.error) {
            $("#auth-error").textContent = result.error.message;
            return;
          }
          if (!result.data.session) {
            $("#auth-error").textContent = "Check your email to confirm the account before signing in.";
            return;
          }
          $("#modal-root").innerHTML = "";
          await enterWithUser(result.data.user);
        });
        $("#reset-password")?.addEventListener("click", resetPassword);
      }

      async function resetPassword() {
        const email = $("#auth-email")?.value.trim();
        if (!email) {
          $("#auth-error").textContent = "Enter your email first.";
          $("#auth-email")?.focus();
          return;
        }
        const result = await db.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
        if (result.error) {
          $("#auth-error").textContent = result.error.message;
          return;
        }
        $("#auth-error").textContent = "Password reset email sent. Check your inbox.";
      }

      function maybeShowTour() {
        if (!state.user) return;
        const key = `dimension-tour-completed:${state.user.id}`;
        if (localStorage.getItem(key) !== "true") openTour(0);
      }

      function openTour(start = 0) {
        let index = Math.max(0, Math.min(start, tourSteps.length - 1));
        const renderStep = () => {
          const [icon, title, copy] = tourSteps[index];
          const finalStep = index === tourSteps.length - 1;
          $("#tour-root").innerHTML = `
            <div class="tour-backdrop">
              <section class="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-title">
                <div class="eyebrow">Dimension orientation · ${String(index + 1).padStart(2, "0")} / ${tourSteps.length}</div>
                <div class="tour-step-icon" aria-hidden="true">${icon}</div>
                <h2 id="tour-title">${title}</h2>
                <p>${copy}</p>
                <div class="tour-progress" aria-hidden="true">${tourSteps.map((_, step) => `<i class="${step === index ? "active" : ""}"></i>`).join("")}</div>
                <div class="tour-actions">
                  <button class="text-button tour-skip" data-tour="skip">Skip tutorial</button>
                  <button class="ghost-button tour-back" data-tour="back" ${index === 0 ? "disabled" : ""}>Back</button>
                  <button class="primary-button" data-tour="next">${finalStep ? "Enter the dimension →" : "Next →"}</button>
                </div>
              </section>
            </div>`;
          $("#tour-root").querySelector("[data-tour='back']").addEventListener("click", () => { if (index > 0) { index -= 1; renderStep(); } });
          $("#tour-root").querySelector("[data-tour='next']").addEventListener("click", () => {
            if (finalStep) completeTour();
            else { index += 1; renderStep(); }
          });
          $("#tour-root").querySelector("[data-tour='skip']").addEventListener("click", completeTour);
        };
        renderStep();
      }

      function completeTour() {
        if (state.user) localStorage.setItem(`dimension-tour-completed:${state.user.id}`, "true");
        $("#tour-root").innerHTML = "";
      }

      function openCommandPalette() {
        const commands = [
          ["◌", "Open Flow", "flow"],
          ["✧", "Find communities", "constellation"],
          ["⌕", "Discover ARMYs", "discover"],
          ["◷", "Open Events", "events"],
          ["⌁", "Open Messages", "messages"],
          ["◎", "Open Profile", "profile"]
        ];
        $("#command-root").innerHTML = `<div class="command-backdrop" data-command-close><section class="command-card" role="dialog" aria-modal="true" aria-label="Dimension command palette"><input class="command-search" id="command-search" placeholder="Search commands..." autofocus /><div class="command-list">${commands.map(([icon, label, view]) => `<button class="command-item" data-command-view="${view}"><b>${icon}</b>${label}</button>`).join("")}</div></section></div>`;
        const input = $("#command-search");
        input.focus();
        input.addEventListener("input", () => {
          const query = input.value.toLowerCase();
          $$(".command-item").forEach((item) => { item.hidden = !item.textContent.toLowerCase().includes(query); });
        });
      }

      function render() {
        if (!state.user) return;
        const [title, subtitle] = pageMeta[state.view];
        $("#page-title").textContent = title;
        $("#page-subtitle").textContent = subtitle;
        $$(".nav-button, .mobile-nav button").forEach((button) => button.classList.toggle("active", button.dataset.view === state.view));
        $("#mini-name").textContent = currentName();
        $("#mini-handle").textContent = `@${state.profile?.username || "army"} · ${state.profile?.role || "member"}`;
        const updateAvatar = (selector, profile, fallback) => {
          const element = $(selector);
          if (!element) return;
          const image = profile?.avatar_url || profile?.avatar || profile?.profile_image_url || profile?.photo_url;
          element.className = `avatar small ${escapeHTML(profile?.avatar_color || currentAvatar())}${image ? " has-image" : ""}`;
          element.innerHTML = image ? `<img src="${escapeHTML(image)}" alt="" />` : escapeHTML(initials(displayName(profile, fallback)));
        };
        updateAvatar("#mini-avatar", state.profile, currentName());
        $("#top-user-name").textContent = currentName();
        updateAvatar("#top-avatar", state.profile, currentName());
        const unreadCount = state.notifications.filter((item) => item.read !== true && item.is_read !== true && item.read_at == null).length;
        $$(".signal-count").forEach((element) => {
          element.textContent = unreadCount ? unreadCount : "";
          element.classList.toggle("hidden", !unreadCount);
        });
        const renderer = renderers[state.view] || renderFlow;
        $("#view-container").innerHTML = renderer();
        bindViewEvents();
        renderSearchOverlay();
      }

      function renderSearchOverlay() {
        const root = $("#search-results-root") || (() => {
          const element = document.createElement("div");
          element.id = "search-results-root";
          document.body.appendChild(element);
          return element;
        })();
        if (!state.searchOpen || state.query.length < 2) { root.innerHTML = ""; return; }
        const query = state.query.toLowerCase();
        const filter = state.searchFilter;
        const people = (filter === "all" || filter === "people") ? state.profiles.filter((profile) => `${profile.username} ${profile.display_name} ${profile.bio}`.toLowerCase().includes(query)).slice(0, 8) : [];
        const communities = (filter === "all" || filter === "communities") ? state.communities.filter((community) => `${community.name} ${community.description} ${community.category}`.toLowerCase().includes(query)).slice(0, 8) : [];
        const posts = (filter === "all" || filter === "posts") ? state.posts.filter((post) => `${post.content || post.body || post.text}`.toLowerCase().includes(query)).slice(0, 8) : [];
        const events = (filter === "all" || filter === "events") ? state.events.filter((event) => `${event.name} ${event.title} ${event.description}`.toLowerCase().includes(query)).slice(0, 8) : [];
        const section = (title, rows) => rows.length ? `<section class="search-result-section"><h4>${title}</h4>${rows.map((row) => {
          if (title === "People") return `<button class="search-result" data-profile="${escapeHTML(row.id)}">${avatarMarkup(row, "small", "ARMY")}<span class="search-result-copy"><strong>${escapeHTML(displayName(row))}</strong><span>@${escapeHTML(row.username || "army")} · ${escapeHTML(row.bio || "No bio")}</span></span></button>`;
          if (title === "Communities") return `<button class="search-result" data-search-community="${escapeHTML(row.id)}"><span class="community-avatar" style="width:30px;height:30px;border-radius:9px">${escapeHTML(initials(row.name || "C"))}</span><span class="search-result-copy"><strong>${escapeHTML(row.name || "Unnamed community")}</strong><span>${escapeHTML(row.description || "No description")}</span></span></button>`;
          if (title === "Events") return `<button class="search-result" data-search-event="${escapeHTML(row.id)}"><span class="chat-channel-icon" style="width:30px;height:30px;border-radius:9px">◷</span><span class="search-result-copy"><strong>${escapeHTML(row.title || row.name || "Event")}</strong><span>${escapeHTML(formatTime(row.starts_at || row.start_at || row.date))}</span></span></button>`;
          return `<button class="search-result" data-search-post="${escapeHTML(row.id)}">${avatarMarkup(profileFor(row.author_id || row.user_id), "small", "ARMY")}<span class="search-result-copy"><strong>${escapeHTML(displayName(profileFor(row.author_id || row.user_id), "ARMY"))}</strong><span>${escapeHTML(row.content || row.body || row.text || "")}</span></span></button>`;
        }).join("")}</section>` : "";
        root.innerHTML = `<div class="search-results"><div class="eyebrow">Live search · ${escapeHTML(state.query)}</div><div class="search-filter-row">${["all", "people", "communities", "posts", "events"].map((item) => `<button class="search-filter ${filter === item ? "active" : ""}" data-search-filter="${item}">${item}</button>`).join("")}</div>${section("People", people)}${section("Communities", communities)}${section("Posts", posts)}${section("Events", events)}${!people.length && !communities.length && !posts.length && !events.length ? empty("No live matches.", "Search only covers records currently returned by Supabase.") : ""}</div>`;
        $$("[data-search-filter]", root).forEach((button) => button.addEventListener("click", () => { state.searchFilter = button.dataset.searchFilter; renderSearchOverlay(); }));
        $$("[data-profile]", root).forEach((button) => button.addEventListener("click", () => { state.profileTargetId = button.dataset.profile; state.searchOpen = false; state.profileTab = "posts"; setView("profile"); }));
        $$("[data-search-community]", root).forEach((button) => button.addEventListener("click", () => { state.selectedCommunityId = button.dataset.searchCommunity; state.searchOpen = false; setView("messages"); }));
        $$("[data-search-post]", root).forEach((button) => button.addEventListener("click", () => { state.searchOpen = false; state.view = "flow"; render(); }));
        $$("[data-search-event]", root).forEach((button) => button.addEventListener("click", () => { state.searchOpen = false; setView("events"); }));
      }

      function postTemplate(post) {
        const communityId = post.raw?.community_id;
        const community = state.communities.find((item) => String(item.id) === String(communityId));
        const communityOwner = community?.created_by || community?.owner_id || community?.creator_id;
        const canPin = isAdmin() || String(communityOwner) === String(state.user.id);
        return `<article class="card post-card" data-post="${escapeHTML(post.id)}">
          <div class="post-meta"><button class="text-button" data-profile="${escapeHTML(post.authorId || "")}" aria-label="Open ${escapeHTML(post.author)} profile">${avatarMarkup(profileFor(post.authorId), "", post.author)}</button><div class="post-author"><strong>${presenceMarkup(post.authorId)}${escapeHTML(post.author)}</strong><span>${escapeHTML(post.role)} · ${escapeHTML(post.time)}${post.pinned ? ` · <b class="featured-mark">PINNED</b>` : ""}</span></div><div style="display:flex;gap:8px;align-items:center"><button class="more-button" data-post-report="${escapeHTML(post.id)}" aria-label="Report post">···</button>${canPin ? `<button class="card-link" data-post-pin="${escapeHTML(post.id)}">${post.pinned ? "Unpin" : "Pin"}</button>` : ""}</div></div>
          <div class="post-body"><p>${post.text || "<span class=\"muted\">Empty signal</span>"}</p></div>
          ${post.image ? `<img class="post-image" src="${escapeHTML(post.image)}" alt="Image attached by ${escapeHTML(post.author)}" />` : ""}
          <div class="post-actions"><button class="action-button ${post.liked ? "active" : ""}" data-post-action="like">♡ ${post.likes}</button><button class="action-button" data-post-action="comment">◌ ${post.comments}</button><button class="action-button" data-post-action="share">↗ Share</button><button class="action-button save ${post.saved ? "active" : ""}" data-post-action="save">${post.saved ? "▣ Saved" : "▱ Save"}</button></div>
        </article>`;
      }

      function empty(title, detail) {
        return `<div class="card empty-state"><strong>${escapeHTML(title)}</strong><p>${escapeHTML(detail)}</p></div>`;
      }

      function renderFlow() {
        const hydrated = state.posts.map(hydratePost).sort((a, b) => Number(b.pinned) - Number(a.pinned)).filter((post) => !state.query || `${post.author} ${post.text}`.toLowerCase().includes(state.query.toLowerCase()));
        const postList = hydrated.length ? hydrated.map(postTemplate).join("") : empty("No live signals yet.", "When someone posts to the connected database, it will appear here.");
        const liveCommunity = state.communities[0];
        const unread = state.notifications.filter((notification) => notification.read !== true && notification.is_read !== true && !notification.read_at).length;
        const communityPreview = state.communities.slice(0, 3).map((community) => {
          const memberCount = state.communityMembers.filter((member) => String(member.community_id) === String(community.id)).length;
          return `<div class="orbit-row"><span class="orbit-glyph">✦</span><div><strong>${escapeHTML(community.name || "Unnamed community")}</strong><span>${memberCount} visible member${memberCount === 1 ? "" : "s"}</span></div><button class="card-link" data-view="constellation">Open</button></div>`;
        }).join("");
        const notificationPreview = state.notifications.slice(0, 3).map((notification) => {
          const actor = profileFor(notification.actor_id || notification.user_id || notification.sender_id);
          return `<div class="orbit-row"><span class="avatar small ${escapeHTML(actor?.avatar_color || "blue")}">${escapeHTML(initials(displayName(actor, "SIGNAL")))}</span><div><strong>${escapeHTML(notification.title || notification.message || notification.content || "New signal")}</strong><span>${escapeHTML(formatTime(notification.created_at))}</span></div></div>`;
        }).join("");
        return `<div class="flow-dashboard">
          <section class="flow-intro card">
            <div><div class="eyebrow">Dimension pulse · live</div><h1>Welcome back, ${escapeHTML(currentName())}.</h1><p>Your orbit is assembled from the records currently visible to your account.</p></div>
            <div class="flow-mark" aria-hidden="true"><span>7</span><i></i></div>
          </section>
          <div class="metric-strip">
            <div class="metric"><span>Stored signals</span><strong>${state.posts.length}</strong><small>public.posts</small></div>
            <div class="metric"><span>Visible ARMYs</span><strong>${state.profiles.length}</strong><small>public.profiles</small></div>
            <div class="metric"><span>Communities</span><strong>${state.communities.length}</strong><small>connected orbit</small></div>
            <div class="metric"><span>Unread signal</span><strong>${unread}</strong><small>notifications</small></div>
          </div>
          <div class="content-grid"><section class="stack">
             <div class="card composer"><div class="composer-head">${currentAvatarMarkup()}<input class="composer-input" id="composer-input" maxlength="320" placeholder="Send a signal to the ARMY..." /></div><div id="composer-preview"></div><div class="composer-tools"><button class="tool-button" id="add-tag"># Tag</button><button class="tool-button" id="add-image">▧ Image</button><button class="tool-button" id="save-draft">Save draft</button><input id="post-image-input" type="file" accept="image/*" hidden /><button class="primary-button post-button" id="post-button">Transmit</button></div></div>
            <div class="section-tabs">${["Following", "Recommended", "Latest"].map((tab) => `<button class="section-tab ${state.filter === tab ? "active" : ""}" data-filter="${tab}">${tab}</button>`).join("")}</div>
            <div class="stack" id="post-list">${postList}</div>
          </section><aside class="side-column">
            <section class="card side-card"><div class="card-heading"><div><div class="eyebrow">Connected orbit</div><h3 style="margin-top:6px">Communities</h3></div><button class="card-link" data-view="constellation">All</button></div><div class="signal-line"></div>${communityPreview || empty("No communities yet.", "The connected database has no community records.")}</section>
            <section class="card side-card"><div class="card-heading"><div><div class="eyebrow">Attention layer</div><h3 style="margin-top:6px">Recent signals</h3></div><button class="card-link" data-view="signal">Open</button></div><div class="signal-line"></div>${notificationPreview || empty("No signals detected.", "Your notification stream is empty.")}</section>
            <section class="card side-card"><div class="card-heading"><div><div class="eyebrow">Current pulse</div><h3 style="margin-top:6px">Live database</h3></div><b class="rank">SYNC</b></div><div class="signal-line"></div>${liveCommunity ? `<div class="event-row"><div class="event-date">✧</div><div><strong>${escapeHTML(liveCommunity.name || "Unnamed community")}</strong><span>${escapeHTML(liveCommunity.description || "No description in database.")}</span></div></div>` : empty("No activity yet.", "The pulse will appear when the database has records.")}</section>
          </aside></div>
        </div>`;
      }

      function renderConstellation() {
        const main = state.communities.find((community) => community.is_main === true || community.is_main === "true" || /main\s*stage/i.test(community.name || ""));
        const cards = state.communities.filter((community) => String(community.id) !== String(main?.id)).map((community) => {
          const count = state.communityMembers.filter((member) => String(member.community_id) === String(community.id)).length;
          const joined = state.communityMembers.some((member) => String(member.community_id) === String(community.id) && String(member.user_id) === String(state.user.id));
          const creator = profileFor(community.created_by || community.owner_id || community.creator_id);
          const owner = community.created_by || community.owner_id || community.creator_id;
          return `<article class="community-tile card"><div class="community-tile-visual"><span class="community-avatar">${escapeHTML(initials(community.name || "C"))}</span><span class="community-status">${joined ? "MEMBER" : "OPEN"}</span></div><div class="community-tile-body"><div class="eyebrow">${escapeHTML(community.category || "community")}</div><h3>${escapeHTML(community.name || "Unnamed community")}</h3><p>${escapeHTML(community.description || "No description in database.")}</p><div class="community-tile-meta"><span>${count} member${count === 1 ? "" : "s"}</span><span>${creator ? `by ${escapeHTML(displayName(creator))}` : "creator unavailable"}</span></div><button class="community-action card-link" data-community="${escapeHTML(community.id)}">${joined ? "Enter community →" : "Join orbit →"}</button><div class="person-actions">${(isAdmin() || String(owner) === String(state.user.id)) ? `<button class="card-link" data-edit-community="${escapeHTML(community.id)}">Manage</button>` : ""}<button class="card-link" data-report-community="${escapeHTML(community.id)}">Report</button></div></div></article>`;
        }).join("");
        const mainCount = main ? state.communityMembers.filter((member) => String(member.community_id) === String(main.id)).length : 0;
        const mainCreator = main ? profileFor(main.created_by || main.owner_id || main.creator_id) : null;
        const featured = main ? `<section class="featured-community card"><div class="featured-community-visual"><span class="community-orbit-ring ring-one"></span><span class="community-orbit-ring ring-two"></span><span class="community-avatar large">${escapeHTML(initials(main.name || "MS"))}</span><span class="community-open-badge">● open to all</span></div><div class="featured-community-copy"><div class="eyebrow">Central hub · Main Stage</div><h1>${escapeHTML(main.name || "Main Stage")}</h1><p>${escapeHTML(main.description || "The central community for the connected ARMY constellation.")}</p><div class="featured-community-meta"><span>${mainCount} visible member${mainCount === 1 ? "" : "s"}</span>${mainCreator ? `<span>created by ${escapeHTML(displayName(mainCreator))}</span>` : ""}</div><button class="primary-button" data-open-main-stage="${escapeHTML(main.id)}">Enter stage <span>→</span></button></div></section>` : empty("No Main Stage configured.", "The connected database does not contain a main community.");
        const ranked = state.communities.filter((community) => String(community.id) !== String(main?.id)).map((community) => ({ community, members: state.communityMembers.filter((member) => String(member.community_id) === String(community.id)).length, posts: state.posts.filter((post) => String(post.community_id) === String(community.id)).length })).sort((a, b) => b.members + b.posts - a.members - a.posts);
        const trendCards = ranked.slice(0, 3).map(({ community, members, posts }) => `<div class="orbit-row"><span class="orbit-glyph">✦</span><div><strong>${escapeHTML(community.name || "Unnamed community")}</strong><span>${members} members · ${posts} posts returned</span></div><button class="card-link" data-community="${escapeHTML(community.id)}">Open</button></div>`).join("");
        const newest = state.communities.filter((community) => String(community.id) !== String(main?.id)).slice().sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0)).slice(0, 3).map((community) => `<div class="orbit-row"><span class="orbit-glyph">◇</span><div><strong>${escapeHTML(community.name || "Unnamed community")}</strong><span>Created ${escapeHTML(formatTime(community.created_at))}</span></div></div>`).join("");
        return `<div class="community-dashboard"><section class="community-heading"><div><div class="eyebrow">Live community universe</div><h1>Find your constellation.</h1><p>Explore the communities returned by your connected database.</p></div>${canCreateCommunity() ? `<button class="ghost-button" data-action="create-community">＋ Create community</button>` : ""}</section>${featured}<div class="content-grid"><section class="card side-card"><div class="eyebrow">Calculated from live rows</div><h3 style="margin-top:6px">Trending orbit</h3><div class="signal-line"></div>${trendCards || empty("Not enough activity yet.", "Trending sections appear only when real member or post records exist.")}</section><section class="card side-card"><div class="eyebrow">Fresh coordinates</div><h3 style="margin-top:6px">New communities</h3><div class="signal-line"></div>${newest || empty("No new communities.", "New records will appear here when the database has them.")}</section></div><section class="community-section"><div class="section-heading"><div><div class="eyebrow">Connected spaces</div><h2>Community network</h2></div><span class="section-count">${state.communities.length} total</span></div><div class="community-grid">${cards || empty("No communities yet.", "Create the first community in the connected database.")}</div></section></div>`;
      }

      function renderDiscover() {
        const profiles = state.profiles.filter((profile) => String(profile.id) !== String(state.user.id) && !state.blocks.some((block) => String(block.blocked_id || block.target_user_id || block.blocked_user_id) === String(profile.id)));
        const profileRows = profiles.map((profile) => {
          const follows = state.follows.some((follow) => String(follow.follower_id || follow.user_id) === String(state.user.id) && String(follow.following_id || follow.target_user_id) === String(profile.id));
          const featured = profile.is_featured === true;
          const adminTools = isAdmin() ? `<span class="admin-tools">${featured ? `<span class="featured-mark">Featured ARMY</span>` : ""}<button class="card-link" data-feature-profile="${escapeHTML(profile.id)}">${featured ? "Unfeature" : "Feature"}</button></span>` : "";
          return `<article class="person-card card ${featured ? "is-featured" : ""}"><div class="person-card-top"><button class="text-button" data-profile="${escapeHTML(profile.id)}" aria-label="Open ${escapeHTML(displayName(profile))} profile">${avatarMarkup(profile, "", displayName(profile))}</button>${featured ? `<span class="featured-mark">✦ Featured</span>` : ""}</div><strong>${presenceMarkup(profile.id)}${escapeHTML(displayName(profile))}</strong><span class="person-handle">@${escapeHTML(profile.username || "army")}</span><p>${escapeHTML(profile.bio || "No bio in database.")}</p><div class="person-actions">${adminTools}<button class="card-link" data-follow="${escapeHTML(profile.id)}">${follows ? "Following" : "Follow"}</button><button class="card-link" data-report-user="${escapeHTML(profile.id)}">Report</button></div></article>`;
        }).join("");
        return `<div class="discover-dashboard"><section class="discover-heading hero-card card"><div class="eyebrow">${isAdmin() ? "Admin discovery" : "Database discovery"}</div><h1>Find the people lighting up the dimension.</h1><p>Every profile below is read directly from public.profiles. ${isAdmin() ? "Feature real ARMYs from this view; permission checks remain enforced by Supabase." : "If the table is empty, this space stays empty."}</p><div class="discover-count"><strong>${profiles.length}</strong><span>visible accounts</span></div></section><section class="people-section"><div class="section-heading"><div><div class="eyebrow">Real accounts</div><h2>ARMY directory</h2></div><span class="section-count">${profiles.length} found</span></div><div class="people-grid">${profileRows || empty("No other profiles are visible.", "Invite someone through Supabase Auth to see a real member here.")}</div></section></div>`;
      }

      function renderEvents() {
        const cards = state.events.map((event) => {
          const start = event.starts_at || event.start_at || event.date || event.created_at;
          const date = start ? new Date(start) : null;
          const joined = state.eventMembers.some((member) => String(member.event_id) === String(event.id) && String(member.user_id || member.profile_id) === String(state.user.id));
          const attendees = state.eventMembers.filter((member) => String(member.event_id) === String(event.id)).length;
          return `<article class="event-card card side-card"><div class="event-date-block"><strong>${date && !Number.isNaN(date.getTime()) ? date.getDate() : "—"}</strong><span>${date && !Number.isNaN(date.getTime()) ? date.toLocaleDateString(undefined, { month: "short" }) : "date"}</span></div><div><h3>${escapeHTML(event.title || event.name || "Untitled event")}</h3><p>${escapeHTML(event.description || "No description in database.")}</p><span class="section-count">${attendees} attendee${attendees === 1 ? "" : "s"}</span></div><button class="ghost-button event-action" data-event-rsvp="${escapeHTML(event.id)}">${joined ? "Leave RSVP" : "Join event"}</button></article>`;
        }).join("");
        return `<div class="stack"><section class="hero-card card"><div class="eyebrow">Database events · live RSVPs</div><h1>Meet at the next point.</h1><p>Dates and attendee counts are calculated from the connected events and event_members records.</p></section>${state.capabilities.events === false ? empty("No events configured.", "The connected database does not currently expose an events table.") : cards || empty("No upcoming events.", "Create a real event record to place it on the constellation.")}</div>`;
      }

      function renderSignal() {
        const rows = state.notifications.map((notification) => {
          const actor = profileFor(notification.actor_id || notification.user_id || notification.sender_id);
          const unread = notification.read !== true && notification.is_read !== true && notification.read_at == null;
          return `<div class="event-row notification-row ${unread ? "unread" : ""}" data-notification="${escapeHTML(notification.id || "")}">${avatarMarkup(actor, "small", "SIGNAL")}<div><strong>${escapeHTML(notification.title || notification.message || notification.content || "New signal")}</strong><time>${escapeHTML(formatTime(notification.created_at))}</time></div></div>`;
        }).join("");
        const unread = state.notifications.filter((notification) => notification.read !== true && notification.is_read !== true && notification.read_at == null).length;
        const reports = isAdmin() && state.reports.length ? `<section class="card side-card"><div class="eyebrow">Admin review queue</div><h3 style="margin-top:7px">${state.reports.length} report${state.reports.length === 1 ? "" : "s"} awaiting review</h3>${state.reports.slice(0, 8).map((report) => `<div class="event-row" style="margin-top:12px"><div class="event-date">!</div><div><strong>${escapeHTML(report.reason || "Report")}</strong><span>${escapeHTML(report.target_type || "content")} · ${escapeHTML(formatTime(report.created_at))}</span></div></div>`).join("")}</section>` : "";
        return `<div class="stack"><section class="hero-card card"><div class="eyebrow">Central notification array · ${unread} unread</div><h1>Signals received.</h1><p>Follow, reaction, comment, message, and community activity appear here only when written to Supabase.</p></section><section class="card side-card"><div class="trend-list" style="margin-top:0">${rows || empty("No signals detected.", "Your notification stream is empty.")}</div>${state.notifications.length ? `<button class="ghost-button" style="margin-top:20px;padding:0 16px" data-action="read-signals">Mark all as read</button>` : ""}</section>${reports}</div>`;
      }

      function renderArchive() {
        const saved = state.posts.map(hydratePost).filter((post) => post.saved);
        const collections = state.collections.filter((collection) => !collection.user_id || String(collection.user_id) === String(state.user.id));
        const drafts = state.drafts;
        const collectionBar = `<div class="collection-bar"><button class="collection-chip active" data-collection="all">All saved</button>${collections.map((collection) => `<button class="collection-chip" data-collection="${escapeHTML(collection.id)}">${escapeHTML(collection.name || "Collection")}</button>`).join("")}<button class="ghost-button" style="min-height:29px;padding:0 10px" data-action="create-collection">＋ Collection</button></div>`;
        const draftPanel = `<section class="card side-card"><div class="card-heading"><div><div class="eyebrow">Private workspace</div><h3 style="margin-top:6px">Draft signals</h3></div><span class="section-count">${drafts.length}</span></div>${drafts.length ? drafts.map((draft) => `<div class="draft-row"><p>${escapeHTML(draft.content || draft.body || "Untitled draft")}</p><div class="draft-actions"><button class="card-link" data-draft-edit="${escapeHTML(draft.id)}">Edit</button><button class="card-link" data-draft-delete="${escapeHTML(draft.id)}">Delete</button></div></div>`).join("") : empty("No saved drafts.", "Save an unfinished signal from Flow and continue later.")}</section>`;
        return `<div class="stack"><section class="hero-card card"><div class="eyebrow">Personal vault</div><h1>Keep what moves you.</h1><p>Bookmarks and drafts are scoped to your authenticated account.</p></section>${state.capabilities.bookmarks === false ? empty("Archive is not configured.", "The connected database does not expose a bookmarks table.") : `<section class="card side-card">${collectionBar}${saved.length ? `<div class="stack" id="archive-list">${saved.map((post) => `<div>${postTemplate(post)}<button class="card-link" style="margin:8px 0 0 5px" data-move-bookmark="${escapeHTML(post.id)}">Move to collection</button></div>`).join("")}</div>` : empty("Your archive is empty.", "Save a live signal from Flow to place it here.")}</section>`}${state.capabilities.drafts === false ? empty("Drafts are not configured.", "Add a drafts table with user ownership to enable private drafts.") : draftPanel}</div>`;
      }

      function renderMessages() {
        const stage = state.communities.find((community) => String(community.id) === String(state.selectedCommunityId)) || mainStage();
        const hasChannelIds = state.messages.some((message) => message.community_id);
        const messages = stage && hasChannelIds ? state.messages.filter((message) => String(message.community_id) === String(stage.id)) : state.messages;
        const rows = messages.map((message) => {
          const author = profileFor(message.user_id || message.author_id || message.sender_id);
          const authorId = message.user_id || message.author_id || message.sender_id;
          const mine = String(authorId) === String(state.user.id);
          const admin = author?.role === "admin";
          const read = message.read_at || message.seen_at || message.status === "seen";
          const delivered = read || message.delivered_at || message.status === "delivered";
          return `<article class="chat-message ${mine ? "mine" : ""}">${avatarMarkup(author, "small", message.author_name || "ARMY")}<div class="chat-message-body"><div class="chat-message-meta"><strong>${presenceMarkup(authorId)}${escapeHTML(displayName(author, message.author_name || "ARMY"))}</strong>${admin ? `<span class="admin-badge">ADMIN</span>` : ""}<time>${escapeHTML(formatTime(message.created_at))}</time></div><p>${escapeHTML(message.content || message.body || message.message || "")}${mine ? `<span class="read-state ${read ? "seen" : ""}" title="${read ? "Seen" : delivered ? "Delivered" : "Sent"}">${read ? "✓✓" : delivered ? "✓✓" : "✓"}</span>` : ""}</p></div></article>`;
        }).join("");
        const composer = stage ? `<div class="message-composer"><input id="main-stage-message" maxlength="500" placeholder="Write to ${escapeHTML(stage.name || "Main Stage")}..." /><button class="primary-button" id="send-main-stage-message">Send</button></div>` : "";
        const typers = Object.values(state.typingUsers);
        return `<div class="chat-layout"><section class="chat-panel card"><header class="chat-header"><div class="chat-channel-icon">⌁</div><div><div class="eyebrow">${stage ? `${escapeHTML(stage.name || "Community")} · open channel` : "Live records"}</div><h2>${stage ? escapeHTML(stage.name || "Main Stage") : "Messages"}</h2><span>${stage ? "● live · everyone can join" : "Connected database"}</span></div>${isAdmin() ? `<span class="admin-badge">ADMIN</span>` : ""}</header><div class="chat-messages">${rows || empty("No messages yet.", stage ? "Be the first person to send a message in this channel." : "No message records are visible in the connected database.")}</div><div class="typing-indicator">${typers.length ? `${escapeHTML(typers.slice(0, 2).join(", "))} ${typers.length > 1 ? "are" : "is"} typing...` : ""}</div>${composer || `<div class="chat-locked">A live channel will appear when a community message record is available.</div>`}</section><aside class="chat-aside">${stage ? `<div class="card side-card"><div class="eyebrow">Channel context</div><h3 style="margin-top:7px">${escapeHTML(stage.name || "Main Stage")}</h3><p class="muted" style="margin-top:8px;font-size:11px">${escapeHTML(stage.description || "Open community channel.")}</p></div>` : empty("No channel selected.", "Choose a community with a connected message record.")}</aside></div>`;
      }

      function renderProfile() {
        const target = profileFor(state.profileTargetId) || state.profile;
        const targetId = target?.id || state.user.id;
        const own = String(targetId) === String(state.user.id);
        const posts = state.posts.filter((post) => String(post.author_id || post.user_id || post.owner_id || post.profile_id) === String(targetId)).map(hydratePost);
        const memberships = state.communityMembers.filter((member) => String(member.user_id) === String(targetId));
        const followerCount = state.follows.filter((follow) => String(follow.following_id || follow.target_user_id) === String(targetId)).length;
        const followingCount = state.follows.filter((follow) => String(follow.follower_id || follow.user_id) === String(targetId)).length;
        const cover = target?.banner_url || target?.cover_url || target?.banner_image_url;
        const joined = target?.created_at ? formatTime(target.created_at) : "Joined date unavailable";
        const followsTarget = state.follows.some((follow) => String(follow.follower_id || follow.user_id) === String(state.user.id) && String(follow.following_id || follow.target_user_id) === String(targetId));
        const tabContent = state.profileTab === "posts"
          ? (posts.length ? `<div class="stack">${posts.map(postTemplate).join("")}</div>` : empty("No posts yet.", own ? "Your published signals will appear here." : "This ARMY has not published a signal."))
          : state.profileTab === "communities"
            ? (memberships.length ? `<div class="community-grid">${memberships.map((member) => state.communities.find((community) => String(community.id) === String(member.community_id))).filter(Boolean).map((community) => `<article class="community-tile card"><div class="community-tile-visual"><span class="community-avatar">${escapeHTML(initials(community.name || "C"))}</span><span class="community-status">MEMBER</span></div><div class="community-tile-body"><h3>${escapeHTML(community.name || "Unnamed community")}</h3><p>${escapeHTML(community.description || "No description in database.")}</p></div></article>`).join("")}</div>` : empty("No communities yet.", own ? "Join a community to place it in your orbit." : "No memberships are visible for this profile."))
            : (posts.length || memberships.length ? `<div class="card side-card"><div class="eyebrow">Live activity</div>${posts.slice(0, 5).map((post) => `<div class="event-row" style="margin-top:12px">${avatarMarkup(target, "small", displayName(target))}<div><strong>Published a signal</strong><span>${escapeHTML(post.time)}</span></div></div>`).join("")}${memberships.slice(0, 5).map((member) => `<div class="event-row" style="margin-top:12px"><div class="event-date">✧</div><div><strong>Joined a community</strong><span>${escapeHTML(formatTime(member.created_at))}</span></div></div>`).join("")}</div>` : empty("No activity yet.", "Real activity will appear here when this profile creates or joins something."));
        return `<div class="profile-view"><section class="profile-banner ${cover ? "has-cover" : ""}" ${cover ? `style="background-image:linear-gradient(90deg,rgba(2,8,16,.82),rgba(2,8,16,.2)),url('${escapeHTML(cover)}')"` : ""}><div class="profile-info">${avatarMarkup(target, "", displayName(target))}<div class="profile-info-copy"><h1>${escapeHTML(displayName(target))}</h1><p>@${escapeHTML(target?.username || "army")} · ${escapeHTML(target?.role || "user")} ${presenceMarkup(targetId)}${isOnline(targetId) ? "Online" : "Offline"}</p><p class="profile-bio">${escapeHTML(target?.bio || "No bio in database.")}</p><div class="profile-meta-line"><span>Joined ${escapeHTML(joined)}</span><span>${memberships.length} communities</span></div></div><div class="profile-header-actions">${own ? `<button class="ghost-button" style="padding:0 13px" data-action="edit-profile">Edit profile</button>` : `<button class="ghost-button" style="padding:0 13px" data-follow="${escapeHTML(targetId)}">${followsTarget ? "Following" : "Follow"}</button><button class="ghost-button" style="padding:0 13px" data-block="${escapeHTML(targetId)}">${state.blocks.some((block) => String(block.blocked_id || block.target_user_id || block.blocked_user_id) === String(targetId)) ? "Unblock" : "Block"}</button>`}</div></div></section><section class="profile-counts"><div class="profile-count"><strong>${posts.length}</strong><span>Signals</span></div><div class="profile-count"><strong>${memberships.length}</strong><span>Communities</span></div><button class="profile-count" data-network="followers"><strong>${followerCount}</strong><span>Followers</span></button><button class="profile-count" data-network="following"><strong>${followingCount}</strong><span>Following</span></button></section><div class="profile-tabs">${["posts", "communities", "activity"].map((tab) => `<button class="profile-tab ${state.profileTab === tab ? "active" : ""}" data-profile-tab="${tab}">${tab}</button>`).join("")}</div><div class="profile-columns"><section>${tabContent}</section><aside class="profile-side">${own ? `<div class="card side-card"><div class="eyebrow">Account controls</div><h3 style="margin-top:7px">Your identity is live.</h3><p class="muted" style="margin-top:7px;font-size:11px">Profile edits, uploads, follows, and activity are written to Supabase when the corresponding table or storage bucket exists.</p><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="ghost-button" style="padding:0 12px" data-action="edit-profile">Edit profile</button><button class="ghost-button" style="padding:0 12px" data-action="replay-tour">Replay tour</button></div></div>` : `<div class="card side-card"><div class="eyebrow">ARMY orbit</div><h3 style="margin-top:7px">${escapeHTML(displayName(target))} in the dimension.</h3><p class="muted" style="margin-top:7px;font-size:11px">Only records returned by the connected database are shown.</p></div>`}${own ? `<button class="ghost-button" style="padding:0 15px" data-action="logout">Log out</button>` : ""}</aside></div></div>`;
      }

      const renderers = { flow: renderFlow, constellation: renderConstellation, discover: renderDiscover, signal: renderSignal, archive: renderArchive, events: renderEvents, messages: renderMessages, profile: renderProfile };

      async function uploadToStorage(file, kind) {
        if (!file || !db) return null;
        const buckets = kind === "post" ? ["post-media", "media", "uploads"] : ["profile-media", "avatars", "uploads"];
        const path = `${state.user.id}/${kind}-${Date.now()}-${slug(file.name)}`;
        for (const bucket of buckets) {
          const upload = await db.storage.from(bucket).upload(path, file, { upsert: true, contentType: file.type || "application/octet-stream" });
          if (!upload.error) {
            const publicUrl = db.storage.from(bucket).getPublicUrl(path);
            return publicUrl.data?.publicUrl || null;
          }
        }
        return null;
      }

      async function insertNotification(payload) {
        if (!db) return;
        const candidates = [
          { user_id: payload.user_id, actor_id: state.user.id, type: payload.type, title: payload.title, message: payload.message, entity_id: payload.entity_id, read: false },
          { user_id: payload.user_id, from_user_id: state.user.id, kind: payload.type, content: payload.message, target_id: payload.entity_id, is_read: false }
        ];
        for (const candidate of candidates) {
          const result = await db.from("notifications").insert(candidate);
          if (!result.error) return;
          if (!/column|schema cache/i.test(result.error.message || "")) return;
        }
      }

      async function markNotificationRead(id) {
        const notification = state.notifications.find((item) => String(item.id) === String(id));
        if (!notification || !id || notification.read === true || notification.is_read === true || notification.read_at) return;
        let result = await db.from("notifications").update({ read: true, read_at: new Date().toISOString() }).eq("id", id).eq("user_id", state.user.id);
        if (result.error && /column|schema cache/i.test(result.error.message || "")) result = await db.from("notifications").update({ is_read: true }).eq("id", id).eq("user_id", state.user.id);
        if (result.error) return toast(result.error.message, true);
        await loadLiveData();
      }

      async function updateProfile(payload) {
        const payloads = [
          payload,
          Object.fromEntries(Object.entries(payload).filter(([key]) => !["avatar_url", "banner_url", "cover_url"].includes(key))),
          Object.fromEntries(Object.entries(payload).filter(([key]) => !["username"].includes(key)))
        ];
        for (const candidate of payloads) {
          const result = await db.from("profiles").update(candidate).eq("id", state.user.id).select("*").single();
          if (!result.error) return result;
          if (!/column|schema cache/i.test(result.error.message || "")) return result;
        }
        return { error: new Error("Profile schema did not accept the requested fields.") };
      }

      async function createPost() {
        const input = $("#composer-input");
        const content = input?.value.trim();
        if (!content) return toast("Write a signal before transmitting.", true);
        const imageUrl = state.composerFile ? await uploadToStorage(state.composerFile, "post") : null;
        if (state.composerFile && !imageUrl) return toast("Image upload failed. Check that a Supabase Storage bucket is configured.", true);
        const candidates = [
          { author_id: state.user.id, content, image_url: imageUrl },
          { user_id: state.user.id, content, media_url: imageUrl },
          { author_id: state.user.id, body: content }
        ];
        let result = null;
        for (const payload of candidates) {
          result = await db.from("posts").insert(payload);
          if (!result.error) break;
          if (!/column|schema cache|null value/i.test(result.error.message || "")) break;
        }
        if (result?.error) return toast(`Post failed: ${result.error.message}`, true);
        const mentions = [...content.matchAll(/@([a-z0-9_.-]+)/gi)].map((match) => match[1].toLowerCase());
        for (const profile of state.profiles.filter((item) => mentions.includes(String(item.username || "").toLowerCase()) && String(item.id) !== String(state.user.id))) {
          await insertNotification({ user_id: profile.id, type: "mention", title: `${currentName()} mentioned you in a signal.`, message: `${currentName()} mentioned you in a signal.` });
        }
        await loadLiveData();
        state.composerFile = null;
        toast("Signal transmitted to Supabase.");
      }

      async function toggleLike(post) {
        const existing = state.reactions.find((reaction) => String(reaction.post_id || reaction.target_id || reaction.content_id) === String(post.id) && String(reaction.user_id) === String(state.user.id) && (!reaction.type || reaction.type === "like" || reaction.reaction_type === "like"));
        if (existing) {
          let query = db.from("reactions").delete().eq("user_id", state.user.id);
          if (existing.post_id) query = query.eq("post_id", post.id);
          else query = query.eq("target_id", post.id);
          const result = await query;
          if (result.error) return toast(result.error.message, true);
        } else {
          let result = await db.from("reactions").insert({ post_id: post.id, user_id: state.user.id, type: "like" });
          if (result.error && /column|schema cache/i.test(result.error.message || "")) result = await db.from("reactions").insert({ post_id: post.id, user_id: state.user.id, reaction_type: "like" });
          if (result.error) return toast(result.error.message, true);
          if (post.authorId && String(post.authorId) !== String(state.user.id)) await insertNotification({ user_id: post.authorId, type: "like", entity_id: post.id, title: `${currentName()} liked your signal.`, message: `${currentName()} liked your signal.` });
        }
        await loadLiveData();
      }

      async function addComment(post) {
        return openComments(post);
      }

      async function submitComment(postId, parentId = null) {
        const input = $("#comment-input");
        const content = input?.value.trim();
        if (!content) return;
        const payloads = [
          { post_id: postId, user_id: state.user.id, content, parent_id: parentId },
          { post_id: postId, author_id: state.user.id, body: content, parent_comment_id: parentId },
          { post_id: postId, user_id: state.user.id, content }
        ];
        let result = null;
        for (const payload of payloads) {
          result = await db.from("comments").insert(payload);
          if (!result.error) break;
          if (!/column|schema cache/i.test(result.error.message || "")) break;
        }
        if (result.error) return toast(result.error.message, true);
        const post = state.posts.find((item) => String(item.id) === String(postId));
        const authorId = post?.author_id || post?.user_id || post?.owner_id;
        if (authorId && String(authorId) !== String(state.user.id)) await insertNotification({ user_id: authorId, type: parentId ? "reply" : "comment", entity_id: postId, title: `${currentName()} ${parentId ? "replied to" : "commented on"} your signal.`, message: `${currentName()} ${parentId ? "replied to" : "commented on"} your signal.` });
        await loadLiveData();
        openComments(hydratePost(post || { id: postId }));
        toast(parentId ? "Reply added to the thread." : "Comment added to the live thread.");
      }

      function openComments(post) {
        const comments = state.comments.filter((comment) => String(comment.post_id || comment.target_id) === String(post.id));
        const commentRows = comments.filter((comment) => !comment.parent_id && !comment.parent_comment_id).map((comment) => {
          const author = profileFor(comment.user_id || comment.author_id);
          const replies = comments.filter((reply) => String(reply.parent_id || reply.parent_comment_id) === String(comment.id));
          return `<article class="comment-item">${avatarMarkup(author, "small", "ARMY")}<div class="comment-meta"><strong>${escapeHTML(displayName(author, comment.author_name || "ARMY"))}</strong><span>${escapeHTML(formatTime(comment.created_at))}</span></div><p class="comment-body">${escapeHTML(comment.content || comment.body || "")}</p><div class="comment-actions"><button class="card-link" data-comment-reply="${escapeHTML(comment.id)}">Reply</button><button class="card-link" data-comment-report="${escapeHTML(comment.id)}">Report</button>${String(comment.user_id || comment.author_id) === String(state.user.id) ? `<button class="card-link" data-comment-delete="${escapeHTML(comment.id)}">Delete</button>` : ""}</div>${replies.map((reply) => { const replyAuthor = profileFor(reply.user_id || reply.author_id); return `<div class="comment-item reply">${avatarMarkup(replyAuthor, "small", "ARMY")}<div class="comment-meta"><strong>${escapeHTML(displayName(replyAuthor, "ARMY"))}</strong><span>${escapeHTML(formatTime(reply.created_at))}</span></div><p class="comment-body">${escapeHTML(reply.content || reply.body || "")}</p></div>`; }).join("")}</article>`;
        }).join("");
        $("#modal-root").innerHTML = `<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true"><button class="modal-close" data-close-modal aria-label="Close dialog">×</button><div class="eyebrow">Live thread · ${post.comments || comments.length} comments</div><h2>Join the signal.</h2><p>${escapeHTML(post.text?.replace(/<[^>]+>/g, "") || "Conversation")}</p><div class="comment-thread">${commentRows || empty("No comments yet.", "Start the real thread below.")}</div><form class="form" id="comment-form"><div class="field"><label for="comment-input">Comment</label><textarea id="comment-input" maxlength="500" placeholder="Add a thoughtful reply..." required></textarea></div><input type="hidden" id="comment-parent" value="" /><div class="modal-actions"><button type="button" class="ghost-button" data-close-modal>Close</button><button class="primary-button" type="submit">Publish comment</button></div></form></section></div>`;
        $("#comment-form").addEventListener("submit", (event) => { event.preventDefault(); submitComment(post.id, $("#comment-parent").value || null); });
        $$("[data-comment-reply]").forEach((button) => button.addEventListener("click", () => { $("#comment-parent").value = button.dataset.commentReply; $("#comment-input").focus(); }));
        $$("[data-comment-delete]").forEach((button) => button.addEventListener("click", () => deleteComment(button.dataset.commentDelete, post)));
        $$("[data-comment-report]").forEach((button) => button.addEventListener("click", () => reportRecord("comment", button.dataset.commentReport)));
      }

      async function deleteComment(id, post) {
        let result = await db.from("comments").delete().eq("id", id).eq("user_id", state.user.id);
        if (result.error && /column|schema cache/i.test(result.error.message || "")) result = await db.from("comments").delete().eq("id", id).eq("author_id", state.user.id);
        if (result.error) return toast(result.error.message, true);
        await loadLiveData();
        openComments(hydratePost(post));
      }

      async function toggleBookmark(post) {
        if (state.capabilities.bookmarks === false) return toast("Bookmarks are not configured in this Supabase database.", true);
        const existing = state.bookmarks.find((bookmark) => String(bookmark.post_id || bookmark.target_id || bookmark.content_id) === String(post.id));
        let result;
        if (existing) result = await db.from("bookmarks").delete().eq("user_id", state.user.id).eq(existing.post_id ? "post_id" : "target_id", post.id);
        else result = await db.from("bookmarks").insert({ user_id: state.user.id, post_id: post.id });
        if (result.error) return toast(result.error.message, true);
        await loadLiveData();
      }

      async function togglePin(postId) {
        const row = state.posts.find((item) => String(item.id) === String(postId));
        const community = state.communities.find((item) => String(item.id) === String(row?.community_id));
        const owner = community?.created_by || community?.owner_id || community?.creator_id;
        if (!row || (!isAdmin() && String(owner) !== String(state.user.id))) return toast("Only an admin or community owner can pin a signal.", true);
        const next = !(row.is_pinned === true || row.pinned === true);
        let result = await db.from("posts").update({ is_pinned: next }).eq("id", postId);
        if (result.error && /column|schema cache/i.test(result.error.message || "")) result = await db.from("posts").update({ pinned: next }).eq("id", postId);
        if (result.error) return toast(`Pin update failed: ${result.error.message}`, true);
        await loadLiveData();
        toast(next ? "Signal pinned to the community." : "Signal unpinned.");
      }

      async function reportRecord(type, id) {
        const reason = window.prompt("Report reason: Spam, Harassment, Inappropriate content, or Other", "Other")?.trim();
        if (!reason) return;
        const result = await db.from("reports").insert({ reporter_id: state.user.id, target_type: type, target_id: id, reason });
        if (result.error) return toast(`Report failed: ${result.error.message}`, true);
        toast("Report sent to the admin review queue.");
      }

      async function toggleBlock(profileId) {
        if (String(profileId) === String(state.user.id)) return;
        const existing = state.blocks.find((block) => String(block.blocked_id || block.target_user_id || block.blocked_user_id) === String(profileId));
        const result = existing
          ? await db.from("blocks").delete().eq("id", existing.id)
          : await db.from("blocks").insert({ blocker_id: state.user.id, blocked_id: profileId });
        if (result.error) return toast(`Block update failed: ${result.error.message}`, true);
        await loadLiveData();
        if (existing) toast("User unblocked.");
        else { toast("User blocked. Their content is hidden from your feed."); setView("flow"); }
      }

      function openNetwork(kind, profileId) {
        const ids = state.follows.filter((follow) => {
          const follower = follow.follower_id || follow.user_id;
          const following = follow.following_id || follow.target_user_id;
          return kind === "followers" ? String(following) === String(profileId) : String(follower) === String(profileId);
        }).map((follow) => kind === "followers" ? (follow.follower_id || follow.user_id) : (follow.following_id || follow.target_user_id));
        const people = ids.map((id) => profileFor(id)).filter(Boolean);
        $("#modal-root").innerHTML = `<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true"><button class="modal-close" data-close-modal>×</button><div class="eyebrow">Live network</div><h2>${kind === "followers" ? "Followers" : "Following"}</h2><p>Relationships are read from the connected follow table.</p><div class="comment-thread">${people.length ? people.map((person) => `<div class="event-row">${avatarMarkup(person, "small", "ARMY")}<div><strong>${escapeHTML(displayName(person))}</strong><span>@${escapeHTML(person.username || "army")}</span></div></div>`).join("") : empty(kind === "followers" ? "No followers yet." : "Following nobody yet.", "This network will populate from real follow relationships.")}</div></section></div>`;
      }

      async function toggleEventRsvp(eventId) {
        const existing = state.eventMembers.find((member) => String(member.event_id) === String(eventId) && String(member.user_id || member.profile_id) === String(state.user.id));
        const result = existing
          ? await db.from("event_members").delete().eq("event_id", eventId).eq("user_id", state.user.id)
          : await db.from("event_members").insert({ event_id: eventId, user_id: state.user.id });
        if (result.error) return toast(`RSVP failed: ${result.error.message}`, true);
        await loadLiveData();
        toast(existing ? "RSVP removed." : "You are attending this event.");
      }

      async function saveDraft() {
        const content = $("#composer-input")?.value.trim();
        if (!content) return toast("Write something before saving a draft.", true);
        const result = await db.from("drafts").insert({ user_id: state.user.id, content });
        if (result.error) return toast(`Draft failed: ${result.error.message}`, true);
        await loadLiveData();
        toast("Draft saved privately.");
      }

      async function deleteDraft(id) {
        const result = await db.from("drafts").delete().eq("id", id).eq("user_id", state.user.id);
        if (result.error) return toast(result.error.message, true);
        await loadLiveData();
      }

      function editDraft(id) {
        const draft = state.drafts.find((item) => String(item.id) === String(id));
        if (!draft) return;
        state.view = "flow";
        render();
        const input = $("#composer-input");
        if (input) { input.value = draft.content || draft.body || ""; input.focus(); }
      }

      async function createCollection() {
        const name = window.prompt("Collection name");
        if (!name?.trim()) return;
        const result = await db.from("bookmark_collections").insert({ user_id: state.user.id, name: name.trim() });
        if (result.error) return toast(`Collection failed: ${result.error.message}`, true);
        await loadLiveData();
        toast("Bookmark collection created.");
      }

      async function moveBookmark(postId) {
        if (!state.collections.length) return toast("Create a collection first.", true);
        const choices = state.collections.map((collection, index) => `${index + 1}. ${collection.name}`).join("\n");
        const selected = Number(window.prompt(`Choose a collection:\n${choices}`, "1")) - 1;
        const collection = state.collections[selected];
        if (!collection) return;
        const bookmark = state.bookmarks.find((item) => String(item.post_id || item.target_id || item.content_id) === String(postId));
        const result = await db.from("bookmark_collection_items").insert({ collection_id: collection.id, bookmark_id: bookmark?.id, post_id: postId, user_id: state.user.id });
        if (result.error) return toast(`Move failed: ${result.error.message}`, true);
        toast(`Moved to ${collection.name}.`);
      }

      async function startTyping() {
        if (!state.realtimeChannel || !state.user) return;
        await state.realtimeChannel.send({ type: "broadcast", event: "typing", payload: { user_id: state.user.id, username: currentName(), typing: true } });
        clearTimeout(startTyping.timer);
        startTyping.timer = setTimeout(() => state.realtimeChannel?.send({ type: "broadcast", event: "typing", payload: { user_id: state.user.id, username: currentName(), typing: false } }), 1200);
      }

      async function followProfile(profileId) {
        if (String(profileId) === String(state.user.id)) return toast("You cannot follow yourself.", true);
        const existing = state.follows.find((follow) => String(follow.follower_id || follow.user_id) === String(state.user.id) && String(follow.following_id || follow.target_user_id) === String(profileId));
        let result;
        if (existing) result = await db.from("user_follows").delete().eq("follower_id", state.user.id).eq("following_id", profileId);
        else {
          result = await db.from("user_follows").insert({ follower_id: state.user.id, following_id: profileId });
          if (!result.error) await insertNotification({ user_id: profileId, type: "follow", title: `${currentName()} started following you.`, message: `${currentName()} started following you.` });
        }
        if (result.error) return toast(result.error.message, true);
        await loadLiveData();
      }

      async function joinCommunity(id) {
        const community = state.communities.find((item) => String(item.id) === String(id));
        if (!community) return false;
        const existing = state.communityMembers.some((member) => String(member.community_id) === String(id) && String(member.user_id) === String(state.user.id));
        if (existing) {
          toast("You are already a member of this community.");
          return true;
        }
        const result = await db.from("community_members").insert({ community_id: id, user_id: state.user.id, role: "member", status: "approved" });
        if (result.error) {
          toast(result.error.message, true);
          return false;
        }
        await loadLiveData();
        toast(`Joined ${community.name}.`);
        return true;
      }

      async function sendMainStageMessage() {
        const input = $("#main-stage-message");
        const content = input?.value.trim();
        const stage = state.communities.find((community) => String(community.id) === String(state.selectedCommunityId)) || mainStage();
        if (!stage || !content) return;
        const payloads = [
          { community_id: stage.id, user_id: state.user.id, content },
          { community_id: stage.id, author_id: state.user.id, content },
          { community_id: stage.id, sender_id: state.user.id, content },
          { community_id: stage.id, user_id: state.user.id, body: content }
        ];
        let result = null;
        for (const payload of payloads) {
          result = await db.from("messages").insert(payload);
          if (!result.error) break;
          if (!/column|schema cache/i.test(result.error.message || "")) break;
        }
        if (result?.error) return toast(`Message failed: ${result.error.message}`, true);
        input.value = "";
        await loadLiveData();
        toast(`Message sent to ${stage.name || "the channel"}.`);
      }

      async function toggleFeaturedProfile(profileId) {
        if (!isAdmin()) return toast("Only an admin can feature ARMYs.", true);
        const profile = profileFor(profileId);
        if (!profile) return;
        const result = await db.from("profiles").update({ is_featured: profile.is_featured !== true }).eq("id", profileId).select("*").single();
        if (result.error) return toast(`Feature update failed: ${result.error.message}`, true);
        await loadLiveData();
        toast(profile.is_featured === true ? "ARMY removed from featured." : "ARMY featured in the constellation.");
      }

      function openCreateCommunityModal() {
        if (!canCreateCommunity()) return toast("Only admins and featured ARMYs can create communities.", true);
        $("#modal-root").innerHTML = `<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true" aria-labelledby="community-title"><button class="modal-close" data-close-modal aria-label="Close dialog">×</button><div class="eyebrow">Admin control</div><h2 id="community-title">Create a community</h2><p>This creates a real community record in Supabase. Main Stage remains the open public community.</p><form class="form" id="community-form"><div class="field"><label for="community-name">Name</label><input id="community-name" maxlength="60" required placeholder="Community name" /></div><div class="field"><label for="community-category">Category</label><input id="community-category" maxlength="40" placeholder="Music, projects, discussion..." /></div><div class="field"><label for="community-description">Description</label><textarea id="community-description" maxlength="240" placeholder="What belongs in this constellation?"></textarea></div><p id="community-error" class="muted" style="min-height:18px"></p><div class="modal-actions"><button type="button" class="ghost-button" data-close-modal>Cancel</button><button type="submit" class="primary-button">Create community</button></div></form></section></div>`;
        $("#community-form").addEventListener("submit", createCommunity);
      }

      async function createCommunity(event) {
        event.preventDefault();
        const name = $("#community-name").value.trim();
        const category = $("#community-category").value.trim();
        const description = $("#community-description").value.trim();
        if (!name) return;
        const payloads = [
          { name, category, description, created_by: state.user.id, is_main: false },
          { name, category, description, owner_id: state.user.id, is_main: false },
          { name, category, description, created_by: state.user.id },
          { name, category, description }
        ];
        let result = null;
        for (const payload of payloads) {
          result = await db.from("communities").insert(payload).select("*").maybeSingle();
          if (!result.error) break;
          if (!/column|schema cache|null value/i.test(result.error.message || "")) break;
        }
        if (result?.error) {
          $("#community-error").textContent = result.error.message;
          return;
        }
        $("#modal-root").innerHTML = "";
        await loadLiveData();
        toast("Community created in Supabase.");
      }

      function openCommunityEditor(id) {
        const community = state.communities.find((item) => String(item.id) === String(id));
        if (!community) return;
        const owner = community.created_by || community.owner_id || community.creator_id;
        if (!isAdmin() && String(owner) !== String(state.user.id)) return toast("Only the community owner or an admin can manage this space.", true);
        const members = state.communityMembers.filter((member) => String(member.community_id) === String(id));
        $("#modal-root").innerHTML = `<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true"><button class="modal-close" data-close-modal>×</button><div class="eyebrow">Community control</div><h2>Edit ${escapeHTML(community.name || "community")}</h2><p>Changes are written to the existing communities table.</p><form class="form" id="community-edit-form"><div class="field"><label for="edit-community-name">Name</label><input id="edit-community-name" maxlength="60" value="${escapeHTML(community.name || "")}" required /></div><div class="field"><label for="edit-community-description">Description</label><textarea id="edit-community-description" maxlength="240">${escapeHTML(community.description || "")}</textarea></div><div class="field"><label for="edit-community-image">Community image</label><input id="edit-community-image" type="file" accept="image/*" /></div><div class="field"><label>Members · ${members.length}</label>${members.length ? members.slice(0, 20).map((member) => { const person = profileFor(member.user_id); return `<div class="event-row" style="margin-top:7px">${avatarMarkup(person, "small", "ARMY")}<div><strong>${escapeHTML(displayName(person, "ARMY"))}</strong><span>${escapeHTML(member.role || "member")}</span></div>${String(member.user_id) !== String(state.user.id) ? `<button type="button" class="card-link" data-remove-member="${escapeHTML(member.id || member.user_id)}" data-remove-member-user="${escapeHTML(member.user_id)}">Remove</button>` : ""}</div>`; }).join("") : `<span class="muted">No members are visible.</span>`}</div><p id="community-edit-error" class="muted" style="min-height:18px"></p><div class="modal-actions"><button type="button" class="ghost-button" data-close-modal>Cancel</button><button class="primary-button" type="submit">Save community</button></div></form></section></div>`;
        $("#community-edit-form").addEventListener("submit", async (event) => {
          event.preventDefault();
          const name = $("#edit-community-name").value.trim();
          const description = $("#edit-community-description").value.trim();
          const imageFile = $("#edit-community-image").files[0];
          const image_url = imageFile ? await uploadToStorage(imageFile, "community") : community.image_url;
          let result = await db.from("communities").update({ name, description, image_url }).eq("id", id);
          if (result.error && /column|schema cache/i.test(result.error.message || "")) result = await db.from("communities").update({ name, description }).eq("id", id);
          if (result.error) return ($("#community-edit-error").textContent = result.error.message);
          $("#modal-root").innerHTML = "";
          await loadLiveData();
          toast("Community updated.");
        });
        $$("[data-remove-member]").forEach((button) => button.addEventListener("click", () => removeCommunityMember(id, button.dataset.removeMember, button.dataset.removeMemberUser)));
      }

      async function removeCommunityMember(communityId, memberId, userId) {
        let result = await db.from("community_members").delete().eq("id", memberId);
        if (result.error && /column|schema cache/i.test(result.error.message || "")) result = await db.from("community_members").delete().eq("community_id", communityId).eq("user_id", userId);
        if (result.error) return toast(`Member removal failed: ${result.error.message}`, true);
        await loadLiveData();
        $("#modal-root").innerHTML = "";
        toast("Member removed from the community.");
      }

      function openProfileEditor() {
        $("#modal-root").innerHTML = `<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true"><button class="modal-close" data-close-modal aria-label="Close dialog">×</button><div class="eyebrow">Live identity · Supabase profile</div><h2>Edit your profile</h2><p>Text fields save to public.profiles. Images upload to Supabase Storage before their public URL is saved.</p><form class="form" id="profile-form"><div class="field"><label for="profile-username">Username</label><input id="profile-username" maxlength="24" pattern="[A-Za-z0-9_.-]{3,24}" value="${escapeHTML(state.profile?.username || "")}" required /><small class="muted">3–24 characters: letters, numbers, dot, underscore, hyphen.</small></div><div class="field"><label for="profile-name">Display name</label><input id="profile-name" maxlength="32" value="${escapeHTML(state.profile?.display_name || state.profile?.username || "")}" required /></div><div class="field"><label for="profile-bio">Bio</label><textarea id="profile-bio" maxlength="160">${escapeHTML(state.profile?.bio || "")}</textarea></div><div class="field"><label for="profile-avatar-file">Profile picture</label><input id="profile-avatar-file" type="file" accept="image/*" /></div><div class="field"><label for="profile-banner-file">Profile banner</label><input id="profile-banner-file" type="file" accept="image/*" /></div><p id="profile-error" class="muted" style="min-height:18px"></p><div class="modal-actions"><button type="button" class="ghost-button" data-close-modal>Cancel</button><button type="submit" class="primary-button">Save profile</button></div></form></section></div>`;
        $("#profile-form").addEventListener("submit", async (event) => {
          event.preventDefault();
          const submit = event.submitter;
          submit.disabled = true;
          const username = $("#profile-username").value.trim().toLowerCase();
          const display_name = $("#profile-name").value.trim();
          const bio = $("#profile-bio").value.trim();
          if (!/^[a-z0-9_.-]{3,24}$/.test(username)) { $("#profile-error").textContent = "Username must be 3–24 characters using letters, numbers, dot, underscore, or hyphen."; submit.disabled = false; return; }
          const duplicate = await db.from("profiles").select("id").eq("username", username).neq("id", state.user.id).maybeSingle();
          if (duplicate.data) { $("#profile-error").textContent = "That username is already in use."; submit.disabled = false; return; }
          const avatarFile = $("#profile-avatar-file").files[0];
          const bannerFile = $("#profile-banner-file").files[0];
          const avatar_url = avatarFile ? await uploadToStorage(avatarFile, "avatar") : state.profile?.avatar_url;
          const banner_url = bannerFile ? await uploadToStorage(bannerFile, "banner") : state.profile?.banner_url;
          if (avatarFile && !avatar_url || bannerFile && !banner_url) { $("#profile-error").textContent = "The selected image could not be uploaded. Check that a Supabase Storage bucket is available."; submit.disabled = false; return; }
          const result = await updateProfile({ username, display_name, bio, avatar_url, banner_url });
          submit.disabled = false;
          if (result.error) { $("#profile-error").textContent = result.error.message; return; }
          state.profile = result.data;
          $("#modal-root").innerHTML = "";
          await loadLiveData();
          toast("Profile updated in Supabase.");
        });
      }

      function bindViewEvents() {
        $$(".section-tab").forEach((button) => button.addEventListener("click", () => { state.filter = button.dataset.filter; render(); }));
        $("#post-button")?.addEventListener("click", createPost);
        $("#add-tag")?.addEventListener("click", () => { const input = $("#composer-input"); input.value = `${input.value}${input.value ? " " : ""}#ARMY `; input.focus(); });
        $("#add-image")?.addEventListener("click", () => $("#post-image-input").click());

          state.composerFile = event.target.files[0] || null;

          $("#remove-post-image")?.addEventListener("click", () => { state.composerFile = null; $("#post-image-input").value = ""; preview.innerHTML = ""; });

        $("#composer-input")?.addEventListener("input", startTyping);

          const post = hydratePost(state.posts.find((item) => String(item.id) === String(button.closest("[data-post]").dataset.post)));

            const text = `7TH DIMENSION · ${post.author}: ${post.text.replace(/<[^>]+>/g, "")}`;
            if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text).catch(() => {});
            toast("Live signal link copied.");
          }
        }));
        $$("[data-community]").forEach((button) => button.addEventListener("click", async () => {
          const id = button.dataset.community;
          const joined = await joinCommunity(id);
          if (joined) {
            state.selectedCommunityId = id;
            setView("messages");
          }
        }));

        $$("[data-post-pin]").forEach((button) => button.addEventListener("click", () => togglePin(button.dataset.postPin)));
        $$("[data-report-user]").forEach((button) => button.addEventListener("click", () => reportRecord("user", button.dataset.reportUser)));
