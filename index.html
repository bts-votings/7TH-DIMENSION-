        $$("[data-event-rsvp]").forEach((button) => button.addEventListener("click", () => toggleEventRsvp(button.dataset.eventRsvp)));

          const unread = state.notifications.filter((item) => item.id && item.read !== true && item.is_read !== true && !item.read_at);
          for (const item of unread) {
            let result = await db.from("notifications").update({ read: true, read_at: new Date().toISOString() }).eq("id", item.id);
            if (result.error && /column|schema cache/i.test(result.error.message || "")) await db.from("notifications").update({ is_read: true }).eq("id", item.id);

      async function logout() {
        if (state.realtimeChannel) await db.removeChannel(state.realtimeChannel);
        await db.auth.signOut();
        window.location.reload();
      }

      function setView(view) {
        if (!renderers[view] || !state.user) return;
        state.view = view;
        render();
      }

      document.addEventListener("click", (event) => {
        const view = event.target.closest("[data-view]");
        if (view) { event.preventDefault(); if (view.dataset.view === "profile") state.profileTargetId = state.user?.id || null; setView(view.dataset.view); return; }
        const commandView = event.target.closest("[data-command-view]");
        if (commandView) {
          $("#command-root").innerHTML = "";
          setView(commandView.dataset.commandView);
          return;
        }
        const auth = event.target.closest("[data-modal]");
        if (auth) { openAuthModal(auth.dataset.modal); return; }
        const closeTarget = event.target.closest("[data-close-modal]");
        const clickedBackdrop = closeTarget?.classList.contains("modal-backdrop") && event.target === closeTarget;
        const clickedCloseButton = closeTarget && !closeTarget.classList.contains("modal-backdrop");
        if (clickedBackdrop || clickedCloseButton) $("#modal-root").innerHTML = "";
        const commandClose = event.target.closest("[data-command-close]");
        if (commandClose && event.target === commandClose) $("#command-root").innerHTML = "";
        if (event.target.closest("[data-action='settings']")) toast("Settings will be backed by the same Supabase profile and preference tables.");
      });
      $("#enter-button").addEventListener("click", () => state.user ? enterWithUser(state.user) : openAuthModal("login"));
      $("#explore-button").addEventListener("click", () => state.user ? setView("discover") : openAuthModal("login"));
      $("#search-input").addEventListener("input", (event) => { state.query = event.target.value.trim(); state.searchOpen = Boolean(state.query); if (state.user) render(); });
      $("#search-input").addEventListener("focus", () => { if (state.query.length >= 2) { state.searchOpen = true; renderSearchOverlay(); } });
      window.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
          event.preventDefault();
          if (state.user) openCommandPalette();
        }
        if (event.key === "Escape") {
          $("#modal-root").innerHTML = "";
          $("#tour-root").innerHTML = "";
          $("#command-root").innerHTML = "";
        }
      });

      function openPasswordUpdateModal() {
        $("#modal-root").innerHTML = `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="password-title"><div class="eyebrow">Secure account recovery</div><h2 id="password-title">Choose a new password</h2><p>This update is sent directly to your authenticated Supabase session.</p><form class="form" id="password-update-form"><div class="field"><label for="new-password">New password</label><input id="new-password" type="password" minlength="6" required /></div><p id="password-update-error" class="muted" style="min-height:18px"></p><div class="modal-actions"><button type="submit" class="primary-button">Update password</button></div></form></section></div>`;
        $("#password-update-form").addEventListener("submit", async (event) => {
          event.preventDefault();
          const password = $("#new-password").value;
          const result = await db.auth.updateUser({ password });
          if (result.error) {
            $("#password-update-error").textContent = result.error.message;
            return;
          }
          $("#modal-root").innerHTML = "";
          toast("Password updated securely.");
        });
      }

      (async function bootLive() {
        if (!db) return toast("Supabase client could not load.", true);
        const sessionResult = await db.auth.getSession();
        if (sessionResult.data.session?.user) await enterWithUser(sessionResult.data.session.user);
        db.auth.onAuthStateChange(async (event, session) => {
          if (event === "PASSWORD_RECOVERY") openPasswordUpdateModal();
          if (session?.user && !state.user) await enterWithUser(session.user);
        });
      })();
    })();
  </script>
</body>
</html>
