          card.querySelector(".post-menu")?.remove();
          if (item.dataset.postMenuAction === "edit") openPostEditor(raw);
          if (item.dataset.postMenuAction === "delete") await deletePost(post);
          if (item.dataset.postMenuAction === "report") await reportContent("post", post.id);
        }));
      }

      function openPostEditor(raw) {
        if (String(raw.author_id || raw.user_id || raw.owner_id) !== String(state.user.id)) return toast("Only the signal creator can edit it.", true);
        const current = raw.content ?? raw.body ?? raw.text ?? raw.caption ?? "";
        $("#modal-root").innerHTML = `<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-post-title"><button class="modal-close" data-close-modal aria-label="Close dialog">×</button><div class="eyebrow">Signal control</div><h2 id="edit-post-title">Edit your signal</h2><form class="form" id="edit-post-form"><div class="field"><label for="edit-post-input">Signal text</label><textarea id="edit-post-input" maxlength="320" required>${escapeHTML(current)}</textarea></div><div class="modal-actions"><button type="button" class="ghost-button" data-close-modal>Cancel</button><button type="submit" class="primary-button">Save changes</button></div></form></section></div>`;
        $("#edit-post-form").addEventListener("submit", async (event) => {
          event.preventDefault();
          const content = $("#edit-post-input").value.trim();
          let result = await db.from("posts").update({ content }).eq("id", raw.id).eq("author_id", state.user.id);
          if (result.error && /column|schema cache/i.test(result.error.message || "")) result = await db.from("posts").update({ body: content }).eq("id", raw.id).eq("user_id", state.user.id);
          if (result.error) return safeError("Signal edit", result.error);
          $("#modal-root").innerHTML = "";
          await loadLiveData();
          toast("Signal updated.");
        });
      }

      async function deletePost(post) {
        let result = await db.from("posts").delete().eq("id", post.id).eq("author_id", state.user.id);
        if (result.error && /column|schema cache/i.test(result.error.message || "")) result = await db.from("posts").delete().eq("id", post.id).eq("user_id", state.user.id);
        if (result.error) return safeError("Signal deletion", result.error);
        await loadLiveData();
        toast("Signal deleted.");
      }

      async function toggleBookmark(post) {
        if (state.capabilities.bookmarks === false) return toast("Bookmarks are not configured in this Supabase database.", true);
        const existing = state.bookmarks.find((bookmark) => String(bookmark.post_id || bookmark.target_id || bookmark.content_id) === String(post.id));
        let result;
        if (existing) result = await db.from("bookmarks").delete().eq("user_id", state.user.id).eq(existing.post_id ? "post_id" : "target_id", post.id);
        else result = await db.from("bookmarks").insert({ user_id: state.user.id, post_id: post.id });
        if (result.error) return safeError("Archive update", result.error);
        await loadLiveData();
      }

      async function followProfile(profileId) {
        const existing = state.follows.find((follow) => String(follow.follower_id || follow.user_id) === String(state.user.id) && String(follow.following_id || follow.target_user_id) === String(profileId));
        let result;
        if (existing) result = await db.from("user_follows").delete().eq("follower_id", state.user.id).eq("following_id", profileId);
        else result = await db.from("user_follows").insert({ follower_id: state.user.id, following_id: profileId });
        if (result.error) return toast(result.error.message, true);
        await loadLiveData();
      }

      async function joinCommunity(id) {
        const community = state.communities.find((item) => String(item.id) === String(id));
        if (!community) return false;
        const existing = state.communityMembers.some((member) => String(member.community_id) === String(id) && String(member.user_id) === String(state.user.id));
        if (existing) {
          const isMain = community.is_main === true || community.is_main === "true" || /main\s*stage/i.test(community.name || "");
          if (isMain) return true;
          const leave = await db.from("community_members").delete().eq("community_id", id).eq("user_id", state.user.id);
          if (leave.error) return safeError("Community update", leave.error);
          await loadLiveData();
          toast(`Left ${community.name}.`);
          return true;
        }
        const result = await db.from("community_members").insert({ community_id: id, user_id: state.user.id, role: "member", status: "approved" });
        if (result.error) {
          safeError("Community update", result.error);
          return false;
        }
        await loadLiveData();
        toast(`Joined ${community.name}.`);
        return true;
      }

      async function sendPrivateMessage() {
        const input = $("#private-message-input");
        const active = state.selectedConversationId;
        const content = input?.value.trim();
        if (!active || !content) return;
        const payloads = [
          { conversation_id: active, sender_id: state.user.id, content },
          { conversation_id: active, user_id: state.user.id, content },
          { conversation_id: active, author_id: state.user.id, body: content }
        ];
        let result;
        for (const payload of payloads) {
          result = await db.from("messages").insert(payload);
          if (!result.error) break;
          if (!/column|schema cache|null value/i.test(result.error.message || "")) break;
        }
        if (result?.error) return safeError("Message", result.error);
        input.value = "";
        await loadLiveData();
      }

      async function openNewConversationModal() {
        const profiles = state.profiles.filter((profile) => String(profile.id) !== String(state.user.id));
        if (!profiles.length) return toast("No other visible ARMYs are available yet.", true);
        $("#modal-root").innerHTML = `<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true" aria-labelledby="new-conversation-title"><button class="modal-close" data-close-modal aria-label="Close dialog">×</button><div class="eyebrow">Secure channel</div><h2 id="new-conversation-title">Start a conversation</h2><p>The new channel will be readable only by its participants.</p><form class="form" id="new-conversation-form"><div class="field"><label for="conversation-person">Choose an ARMY</label><select id="conversation-person" style="padding:11px 12px;border:1px solid var(--line);border-radius:10px;color:var(--white);background:rgba(255,255,255,.045)" required>${profiles.map((profile) => `<option value="${escapeHTML(profile.id)}">${escapeHTML(displayName(profile))}</option>`).join("")}</select></div><div class="modal-actions"><button type="button" class="ghost-button" data-close-modal>Cancel</button><button type="submit" class="primary-button">Create channel</button></div></form></section></div>`;
        $("#new-conversation-form").addEventListener("submit", async (event) => {
          event.preventDefault();
          const otherId = $("#conversation-person").value;
          const conversationResult = await db.from("conversations").insert({ created_by: state.user.id }).select("*").single();
          if (conversationResult.error) return safeError("Conversation", conversationResult.error);
          const conversationId = conversationResult.data.id;
          const participants = await db.from("conversation_participants").insert([
            { conversation_id: conversationId, user_id: state.user.id },
            { conversation_id: conversationId, user_id: otherId }
          ]);
          if (participants.error) return safeError("Conversation participants", participants.error);
          $("#modal-root").innerHTML = "";
          state.selectedConversationId = conversationId;
          await loadLiveData();
        });

      async function toggleFeaturedProfile(profileId) {
        if (!isAdmin()) return toast("Only an admin can feature ARMYs.", true);
        const profile = profileFor(profileId);
        if (!profile) return;
        const result = await db.from("profiles").update({ is_featured: profile.is_featured !== true }).eq("id", profileId).select("*").single();
        if (result.error) return safeError("Featured ARMY update", result.error);
        await loadLiveData();
        toast(profile.is_featured === true ? "ARMY removed from featured." : "ARMY featured in the constellation.");

      function openCreateCommunityModal() {

        $("#modal-root").innerHTML = `<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true" aria-labelledby="community-title"><button class="modal-close" data-close-modal aria-label="Close dialog">×</button><div class="eyebrow">Admin control</div><h2 id="community-title">Create a community</h2><p>This creates a real community record in Supabase. Main Stage remains the open public community.</p><form class="form" id="community-form"><div class="field"><label for="community-name">Name</label><input id="community-name" maxlength="60" required placeholder="Community name" /></div><div class="field"><label for="community-category">Category</label><input id="community-category" maxlength="40" placeholder="Music, projects, discussion..." /></div><div class="field"><label for="community-description">Description</label><textarea id="community-description" maxlength="240" placeholder="What belongs in this constellation?"></textarea></div><p id="community-error" class="muted" style="min-height:18px"></p><div class="modal-actions"><button type="button" class="ghost-button" data-close-modal>Cancel</button><button type="submit" class="primary-button">Create community</button></div></form></section></div>`;
        $("#community-form").addEventListener("submit", createCommunity);
      }

      async function createCommunity(event) {
        event.preventDefault();
        const name = $("#community-name").value.trim();
        const category = $("#community-category").value.trim();
        const description = $("#community-description").value.trim();
        if (!name) return;
        const payloads = [
          { name, category, description, created_by: state.user.id, is_main: false },
          { name, category, description, owner_id: state.user.id, is_main: false },
          { name, category, description, created_by: state.user.id },
          { name, category, description }
        ];
        let result = null;
        for (const payload of payloads) {
          result = await db.from("communities").insert(payload).select("*").maybeSingle();
          if (!result.error) break;
          if (!/column|schema cache|null value/i.test(result.error.message || "")) break;
        }
        if (result?.error) {
          $("#community-error").textContent = "Community creation is not available with the current database schema or permissions.";
          console.error("[7TH DIMENSION] Community creation", result.error);
          return;
        }
        $("#modal-root").innerHTML = "";
        await loadLiveData();
        toast("Community created in Supabase.");
      }

          const bio = $("#profile-bio").value.trim();

          const existing = state.eventAttendees.find((item) => String(item.event_id) === String(eventId) && String(item.user_id) === String(state.user.id));

            <label class="setting-row">Online status<select name="online_status"><option ${setting("online_status", "visible") === "visible" ? "selected" : ""} value="visible">Visible</option><option ${setting("online_status", "hidden") === "hidden" ? "selected" : ""} value="hidden">Hidden</option></select></label>
            <label class="setting-row">Country visibility<select name="country_visibility"><option ${setting("country_visibility", "hidden") === "hidden" ? "selected" : ""} value="hidden">Hidden</option><option ${setting("country_visibility", "followers") === "followers" ? "selected" : ""} value="followers">Followers</option><option ${setting("country_visibility", "public") === "public" ? "selected" : ""} value="public">Public</option></select></label>
            <label class="setting-row">Notifications<select name="notification_settings"><option ${setting("notification_settings", "all") === "all" ? "selected" : ""} value="all">All activity</option><option ${setting("notification_settings", "mentions") === "mentions" ? "selected" : ""} value="mentions">Mentions only</option><option ${setting("notification_settings", "none") === "none" ? "selected" : ""} value="none">Off</option></select></label>
            <div class="modal-actions"><button type="button" class="ghost-button" data-action="replay-tour">Replay tour</button><button type="button" class="ghost-button" data-close-modal>Cancel</button><button type="submit" class="primary-button">Save settings</button></div>
          </form>
        </section></div>`;
        $("#settings-form").addEventListener("submit", async (event) => {
          event.preventDefault();
          const values = Object.fromEntries(new FormData(event.currentTarget).entries());
          const result = await db.from("profiles").update(values).eq("id", state.user.id).select("*").single();
          if (result.error) return safeError("Settings update", result.error);
          state.profile = result.data;
          $("#modal-root").innerHTML = "";
          toast("Privacy settings updated.");
        });
        $("[data-action='replay-tour']").addEventListener("click", () => {
          $("#modal-root").innerHTML = "";
          openTour(0);
        });
      }

      async function logout() {
        if (state.realtimeChannel) await db.removeChannel(state.realtimeChannel);
        await db.auth.signOut();
        window.location.reload();
      }

      function setView(view) {
        if (!renderers[view] || !state.user) return;
        state.view = view;
        render();
      }

      document.addEventListener("click", (event) => {
        const view = event.target.closest("[data-view]");
        if (view) { event.preventDefault(); setView(view.dataset.view); return; }
        const commandView = event.target.closest("[data-command-view]");
        if (commandView) {
          $("#command-root").innerHTML = "";
          setView(commandView.dataset.commandView);
          return;
        }
        const auth = event.target.closest("[data-modal]");
        if (auth) { openAuthModal(auth.dataset.modal); return; }
        const closeTarget = event.target.closest("[data-close-modal]");
        const clickedBackdrop = closeTarget?.classList.contains("modal-backdrop") && event.target === closeTarget;
        const clickedCloseButton = closeTarget && !closeTarget.classList.contains("modal-backdrop");
        if (clickedBackdrop || clickedCloseButton) $("#modal-root").innerHTML = "";
        const commandClose = event.target.closest("[data-command-close]");
        if (commandClose && event.target === commandClose) $("#command-root").innerHTML = "";
        if (event.target.closest("[data-action='settings']")) openSettingsModal();
      });
      $("#enter-button").addEventListener("click", () => state.user ? enterWithUser(state.user) : openAuthModal("login"));
      $("#explore-button").addEventListener("click", () => state.user ? setView("discover") : openAuthModal("login"));
      $("#search-input").addEventListener("input", (event) => { state.query = event.target.value.trim(); if (state.user) { state.view = "flow"; render(); } });
      window.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
          event.preventDefault();
          if (state.user) openCommandPalette();
        }
        if (event.key === "Escape") {
          $("#modal-root").innerHTML = "";
          $("#tour-root").innerHTML = "";
          $("#command-root").innerHTML = "";
        }
      });

      function openPasswordUpdateModal() {
        $("#modal-root").innerHTML = `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="password-title"><div class="eyebrow">Secure account recovery</div><h2 id="password-title">Choose a new password</h2><p>This update is sent directly to your authenticated Supabase session.</p><form class="form" id="password-update-form"><div class="field"><label for="new-password">New password</label><input id="new-password" type="password" minlength="6" required /></div><p id="password-update-error" class="muted" style="min-height:18px"></p><div class="modal-actions"><button type="submit" class="primary-button">Update password</button></div></form></section></div>`;
        $("#password-update-form").addEventListener("submit", async (event) => {
          event.preventDefault();
          const password = $("#new-password").value;
          const result = await db.auth.updateUser({ password });
          if (result.error) {
            $("#password-update-error").textContent = "Password update could not be completed. Please try again.";
            console.error("[7TH DIMENSION] Password update", result.error);
            return;
          }
          $("#modal-root").innerHTML = "";
          toast("Password updated securely.");
        });
      }

      (async function bootLive() {
        if (!db) return toast("Supabase client could not load.", true);
        const sessionResult = await db.auth.getSession();
        if (sessionResult.data.session?.user) await enterWithUser(sessionResult.data.session.user);
        db.auth.onAuthStateChange(async (event, session) => {
          if (event === "PASSWORD_RECOVERY") openPasswordUpdateModal();
          if (session?.user && !state.user) await enterWithUser(session.user);
        });
      })();
    })();
  </script>
</body>
</html>
