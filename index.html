<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0918" />
  <meta name="description" content="7th Dimension — a cinematic ARMY community MVP." />
  <title>7TH DIMENSION — One space. Seven stars. One ARMY.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void: #090817;
      --void-soft: #110e24;
      --panel: rgba(18, 16, 38, .77);
      --panel-solid: #15122b;
      --panel-light: rgba(37, 32, 72, .72);
      --line: rgba(220, 215, 255, .14);
      --line-bright: rgba(176, 150, 255, .54);
      --white: #fbfaff;
      --muted: #aaa5c4;
      --dim: #777290;
      --violet: #a88cff;
      --violet-bright: #c1aeff;
      --blue: #9cbcff;
      --green: #b9e5cf;
      --danger: #ff9da9;
      --shadow: 0 30px 100px rgba(0, 0, 0, .42);
      --radius: 22px;
      --radius-small: 13px;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--void); scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--white);
      background: var(--void);
      font: 14px/1.5 Inter, system-ui, sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      background:
        radial-gradient(circle at 51% 31%, rgba(103, 78, 203, .25), transparent 25rem),
        radial-gradient(circle at 7% 94%, rgba(66, 73, 155, .12), transparent 22rem),
        radial-gradient(circle at 94% 9%, rgba(173, 118, 255, .12), transparent 24rem),
        var(--void);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      opacity: .55;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 0 1px, transparent 1.6px),
        radial-gradient(circle, rgba(184,164,255,.7) 0 1px, transparent 1.8px),
        radial-gradient(circle, rgba(255,255,255,.6) 0 1px, transparent 1.5px);
      background-position: 9% 18%, 23% 70%, 77% 12%;
      background-size: 230px 190px, 310px 270px, 420px 360px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--violet-bright);
      outline-offset: 3px;
    }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3, .brand-name, .display-name { font-family: "Space Grotesk", sans-serif; }
    h1 { letter-spacing: -.07em; }
    h2 { letter-spacing: -.04em; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .eyebrow {
      color: var(--violet-bright);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .text-button, .icon-button, .nav-button, .chip, .primary-button, .ghost-button {
      border: 0;
      color: inherit;
      background: transparent;
    }

    /* Shared brand */
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--white);
      text-decoration: none;
    }
    .brand-mark {
      position: relative;
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      color: var(--white);
    }
    .brand-mark::before, .brand-mark::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border: 1px solid currentColor;
      border-radius: 5px;
      transform: rotate(30deg);
    }
    .brand-mark::after { transform: rotate(90deg); opacity: .45; }
    .brand-mark span { width: 4px; height: 4px; z-index: 1; border-radius: 50%; background: currentColor; }
    .brand-name { font-size: 14px; font-weight: 700; letter-spacing: .12em; }

    /* Portal */
    .portal {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      isolation: isolate;
    }
      .portal-reference {
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .065;
      background:
        linear-gradient(180deg, rgba(4, 8, 18, .12), rgba(4, 8, 18, .96));
      filter: saturate(.8) blur(.2px);
      pointer-events: none;
    }
    .portal-header {
      width: min(1100px, calc(100% - 56px));
      margin: 0 auto;
      padding: 18px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .portal-header .brand-mark { width: 24px; height: 24px; color: #bab0ff; }
    .portal-header .brand-mark::before, .portal-header .brand-mark::after { width: 16px; height: 16px; }
    .portal-header .brand-name { font-size: 13px; }
    .portal-links { display: flex; align-items: center; gap: 28px; }
    .portal-link {
      position: relative;
      padding: 4px 0;
      color: var(--muted);
      font-size: 12px;
      text-decoration: none;
    }
    .portal-link:hover, .portal-link.active { color: var(--white); }
    .portal-link.active::after {
      content: "";
      position: absolute;
      right: 0; bottom: -8px; left: 0;
      height: 1px;
      background: var(--white);
      box-shadow: 0 0 10px var(--violet-bright);
    }
    .join-button {
      padding: 7px 22px;
      border: 1px solid rgba(255,255,255,.64);
      border-radius: 99px;
      color: #0c0a16;
      background: var(--white);
      box-shadow: 0 7px 18px rgba(0,0,0,.2);
      font-size: 11px;
      font-weight: 700;
    }
    .join-button:hover { color: var(--white); background: transparent; }
    .portal-main {
      flex: 1;
      position: relative;
      width: min(1120px, calc(100% - 36px));
      margin: 0 auto;
      display: grid;
      place-items: center;
      padding: 45px 0 30px;
      text-align: center;
    }
    .orbit-system {
      position: absolute;
      width: min(620px, 84vw);
      aspect-ratio: 1;
      border: 1px solid rgba(161, 139, 255, .18);
      border-radius: 50%;
      box-shadow: 0 0 100px rgba(104, 73, 222, .13), inset 0 0 90px rgba(113, 88, 221, .08);
      transform: rotate(-17deg);
      pointer-events: none;
    }
    .orbit-system::before, .orbit-system::after {
      content: "";
      position: absolute;
      inset: 11%;
      border: 1px solid rgba(171, 150, 255, .17);
      border-radius: 50%;
    }
    .orbit-system::after { inset: 26%; border-color: rgba(210, 200, 255, .21); transform: rotate(68deg) scaleX(1.5); }
    .orbit-dot {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #e7e0ff;
      box-shadow: 0 0 12px 3px rgba(203, 188, 255, .9);
    }
    .dot-a { top: 10%; left: 31%; }
    .dot-b { top: 20%; right: 18%; background: var(--violet-bright); }
    .dot-c { top: 47%; right: 4%; }
    .dot-d { bottom: 14%; right: 25%; }
    .dot-e { bottom: 20%; left: 17%; background: var(--blue); }
    .dot-f { top: 54%; left: 7%; }
    .dot-g { top: 28%; left: 47%; background: var(--violet-bright); }
    .portal-content { position: relative; z-index: 1; }
    .portal-content h1 {
      max-width: 820px;
      margin: 0 auto;
      color: var(--white);
      font-size: clamp(48px, 9vw, 105px);
      line-height: .9;
      text-transform: uppercase;
      text-shadow: 0 0 45px rgba(159, 131, 255, .24);
    }
    .portal-content h1 span {
      display: block;
      color: #c2b0ff;
      font-size: .57em;
      letter-spacing: -.04em;
      margin-bottom: 9px;
    }
    .portal-tagline {
      margin: 26px 0 31px;
      color: #bcb6d6;
      font-size: clamp(11px, 1.7vw, 14px);
      font-weight: 600;
      letter-spacing: .28em;
      text-transform: uppercase;
    }
    .portal-actions { display: flex; justify-content: center; gap: 13px; }
    .primary-button, .ghost-button {
      min-height: 44px;
      padding: 0 25px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      transition: .25s ease;
    }
    .primary-button {
      color: #0b0916;
      background: var(--white);
      box-shadow: 0 0 28px rgba(215, 204, 255, .16);
    }
    .primary-button:hover { transform: translateY(-2px); box-shadow: 0 0 36px rgba(194, 174, 255, .35); }
    .ghost-button { border: 1px solid rgba(193, 174, 255, .66); color: var(--white); }
    .ghost-button:hover { background: rgba(181, 159, 255, .12); transform: translateY(-2px); }
    .portal-footer {
      width: min(1100px, calc(100% - 36px));
      margin: 0 auto;
      padding-bottom: 15px;
    }
    .feature-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 18px 0;
      border-top: 1px solid rgba(255,255,255,.1);
      border-bottom: 1px solid rgba(255,255,255,.09);
    }
    .feature {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #bdb8d5;
      font-size: 11px;
    }
    .feature i {
      width: 12px;
      height: 12px;
      display: inline-block;
      border: 1px solid var(--violet-bright);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(173, 149, 255, .4);
    }
    .portal-status {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 3px 0;
      color: var(--dim);
      font-size: 10px;
      letter-spacing: .06em;
    }
    .portal-status b { color: #aaa3c9; font-weight: 500; }

    /* App shell */
    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 225px minmax(0, 1fr);
      background:
        linear-gradient(90deg, rgba(6, 5, 14, .54), transparent 33%),
        radial-gradient(circle at 75% 10%, rgba(105, 77, 221, .12), transparent 35rem);
    }
    .sidebar {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 30px;
      padding: 22px 15px 16px;
      border-right: 1px solid var(--line);
      background: rgba(9, 8, 22, .78);
      backdrop-filter: blur(18px);
    }
    .sidebar .brand { padding: 0 9px; }
    .sidebar .brand-mark { color: var(--violet-bright); }
    .nav-label {
      margin: 0 11px 8px;
      color: var(--dim);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .nav-list { display: grid; gap: 4px; }
    .nav-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 11px;
      border: 1px solid transparent;
      border-radius: 11px;
      color: var(--muted);
      text-align: left;
      transition: .2s ease;
    }
    .nav-button:hover, .nav-button.active {
      color: var(--white);
      border-color: var(--line-bright);
      background: rgba(157, 129, 255, .1);
    }
    .nav-button.active .nav-icon { color: var(--violet-bright); }
    .nav-icon { width: 17px; color: #807b9d; font-size: 16px; text-align: center; }
    .sidebar-spacer { flex: 1; }
    .mini-profile {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255,255,255,.035);
      text-align: left;
    }
    .avatar {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 12px;
      color: #130d2c;
      background: linear-gradient(145deg, #dfd5ff, #8e74e8);
      font: 700 12px "Space Grotesk", sans-serif;
    }
    .avatar.small { width: 30px; height: 30px; border-radius: 10px; font-size: 10px; }
    .avatar.blue { background: linear-gradient(145deg, #d9e4ff, #7599ef); }
    .avatar.green { background: linear-gradient(145deg, #d8f6e7, #78c4a1); }
    .avatar.gold { background: linear-gradient(145deg, #fff0c7, #d4a553); }
    .avatar.pink { background: linear-gradient(145deg, #ffe0ee, #c481af); }
    .mini-profile-copy { min-width: 0; }
    .mini-profile-copy strong, .mini-profile-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini-profile-copy strong { font-size: 12px; }
    .mini-profile-copy span { margin-top: 2px; color: var(--muted); font-size: 10px; }
    .main-wrap { min-width: 0; }
    .topbar {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 clamp(18px, 4vw, 45px);
      border-bottom: 1px solid var(--line);
      background: rgba(9, 8, 22, .44);
      backdrop-filter: blur(18px);
    }
    .mobile-menu { display: none; }
    .page-heading h2 { font-size: 20px; }
    .page-heading p { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }
    .search {
      width: min(235px, 23vw);
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      background: rgba(255,255,255,.035);
    }
    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      color: var(--white);
      background: transparent;
      font-size: 12px;
    }
    .search input::placeholder { color: var(--dim); }
    .icon-button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      background: rgba(255,255,255,.035);
      transition: .2s ease;
    }
    .icon-button:hover { color: var(--white); border-color: var(--line-bright); }
    .content {
      width: min(1110px, 100%);
      margin: 0 auto;
      padding: 30px clamp(18px, 4vw, 45px) 90px;
    }
    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(250px, .8fr);
      gap: 20px;
      align-items: start;
    }
    .stack { display: grid; gap: 16px; }
    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 15px 40px rgba(0,0,0,.13);
      backdrop-filter: blur(18px);
    }
    .composer { padding: 18px; }
    .composer-head { display: flex; align-items: center; gap: 11px; }
    .composer-input {
      width: 100%;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: 0;
      color: var(--white);
      background: rgba(255,255,255,.035);
    }
    .composer-input::placeholder { color: var(--muted); }
    .composer-input:focus { border-color: var(--line-bright); box-shadow: 0 0 0 3px rgba(169,140,255,.1); }
    .composer-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 13px;
      padding-left: 42px;
    }
    .tool-button {
      padding: 6px 9px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
    }
    .tool-button:hover { color: var(--white); border-color: var(--line); background: rgba(255,255,255,.04); }
    .post-button { margin-left: auto; padding: 8px 15px; border-radius: 9px; }
    .section-tabs {
      display: flex;
      gap: 20px;
      padding: 0 3px 12px;
      border-bottom: 1px solid var(--line);
    }
    .section-tab {
      position: relative;
      padding: 0;
      border: 0;
      color: var(--muted);
      background: none;
      font-size: 12px;
    }
    .section-tab.active { color: var(--white); }
    .section-tab.active::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -13px;
      left: 0;
      height: 2px;
      background: var(--violet-bright);
      box-shadow: 0 0 10px var(--violet);
    }
    .post-card { padding: 19px; }
    .post-meta { display: flex; align-items: center; gap: 10px; }
    .post-author { min-width: 0; flex: 1; }
    .post-author strong { display: block; font-size: 12px; }
    .post-author span { display: block; margin-top: 1px; color: var(--muted); font-size: 10px; }
    .more-button { padding: 0 5px; border: 0; color: var(--muted); background: none; font-size: 18px; }
    .post-body { padding: 15px 0 6px 42px; }
    .post-body p { color: #dedbf0; font-size: 13px; line-height: 1.7; }
    .post-body .tag { color: var(--violet-bright); }
    .post-image {
      width: calc(100% - 42px);
      max-height: 300px;
      margin: 13px 0 10px 42px;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .post-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 0 0 42px;
      border-top: 1px solid rgba(255,255,255,.07);
    }
    .action-button {
      padding: 5px 9px;
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
    }
    .action-button:hover { color: var(--white); background: rgba(255,255,255,.06); }
    .action-button.active { color: var(--violet-bright); }
    .action-button.save { margin-left: auto; }
    .side-card { padding: 18px; }
    .card-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .card-heading h3 { font-size: 15px; }
    .card-heading p { margin-top: 4px; }
    .card-link { padding: 0; border: 0; color: var(--violet-bright); background: none; font-size: 11px; }
    .signal-line {
      height: 1px;
      margin: 16px 0;
      background: linear-gradient(90deg, var(--violet), transparent);
      opacity: .5;
    }
    .trend-list, .event-list, .member-list { display: grid; gap: 13px; margin-top: 16px; }
    .trend-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .trend-row strong { display: block; color: var(--white); font-size: 12px; font-weight: 600; }
    .trend-row span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
    .rank { color: var(--violet-bright); font: 600 12px "Space Grotesk", sans-serif; }
    .event-row { display: flex; gap: 11px; }
    .event-date {
      width: 38px;
      height: 42px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid rgba(173,149,255,.35);
      border-radius: 9px;
      color: var(--violet-bright);
      background: rgba(159,131,255,.09);
      font: 700 11px/1.1 "Space Grotesk", sans-serif;
      text-align: center;
      text-transform: uppercase;
    }
    .event-row strong { display: block; font-size: 11px; font-weight: 600; }
    .event-row span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .online-dot { color: var(--green); }
    .view { animation: view-in .4s ease both; }
    @keyframes view-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Secondary views */
    .hero-card {
      position: relative;
      overflow: hidden;
      padding: 28px;
      background:
        radial-gradient(circle at 85% 20%, rgba(164,137,255,.25), transparent 17rem),
        linear-gradient(135deg, rgba(55,42,112,.62), rgba(18,16,38,.76));
    }
    .hero-card::after {
      content: "7";
      position: absolute;
      top: -45px;
      right: 36px;
      color: rgba(199,183,255,.08);
      font: 700 230px "Space Grotesk", sans-serif;
      line-height: 1;
    }
    .hero-card h1 { position: relative; z-index: 1; max-width: 550px; margin-top: 10px; font-size: clamp(28px, 4vw, 50px); }
    .hero-card p { position: relative; z-index: 1; max-width: 490px; margin-top: 11px; color: var(--muted); }
    .cards-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .community-card { position: relative; overflow: hidden; padding: 19px; min-height: 170px; }
    .community-card::before {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      top: -70px;
      right: -40px;
      border: 1px solid rgba(176,150,255,.25);
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(159,131,255,.16);
    }
    .community-card h3 { position: relative; margin-top: 16px; font-size: 17px; }
    .community-card p { position: relative; margin-top: 5px; color: var(--muted); font-size: 11px; }
    .community-foot { position: absolute; right: 19px; bottom: 17px; left: 19px; display: flex; justify-content: space-between; color: var(--dim); font-size: 10px; }
    .community-open-badge { display: inline-flex; align-items: center; gap: 6px; color: #d9ccff; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    .community-open-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #8fffc7; box-shadow: 0 0 10px #8fffc7; }
    .admin-tools { display: inline-flex; align-items: center; gap: 8px; margin-left: 8px; color: #e6dfff; font-size: 10px; }
    .admin-badge { color: #f2d998; letter-spacing: .1em; font-size: 9px; text-transform: uppercase; }
    .message-composer { display: flex; gap: 9px; align-items: center; margin-top: 16px; }
    .message-composer input { flex: 1; min-width: 0; }
    .featured-mark { color: #f2d998; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    .profile-view { display: grid; gap: 17px; }
    .profile-banner {
      position: relative;
      min-height: 215px;
      padding: 25px;
      display: flex;
      align-items: flex-end;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background:
        radial-gradient(circle at 65% 35%, rgba(190,169,255,.31) 0 2px, transparent 3px),
        radial-gradient(circle at 77% 60%, rgba(185,163,255,.25) 0 1px, transparent 2px),
        linear-gradient(130deg, #171139, #090817 75%);
    }
    .profile-banner::before, .profile-banner::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(177,153,255,.22);
      border-radius: 50%;
      transform: rotate(25deg);
    }
    .profile-banner::before { width: 490px; height: 190px; right: -100px; top: -30px; }
    .profile-banner::after { width: 390px; height: 150px; right: -35px; top: 6px; }
    .profile-info { position: relative; z-index: 1; display: flex; align-items: center; gap: 14px; }
    .profile-info .avatar { width: 58px; height: 58px; border: 3px solid rgba(255,255,255,.7); border-radius: 18px; font-size: 18px; }
    .profile-info h1 { font-size: 26px; }
    .profile-info p { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .stats-card { display: grid; grid-template-columns: repeat(3, 1fr); padding: 17px; }
    .stat { padding: 2px 17px; border-right: 1px solid var(--line); text-align: center; }
    .stat:last-child { border-right: 0; }
    .stat strong { display: block; color: var(--white); font: 700 21px "Space Grotesk", sans-serif; }
    .stat span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
    .empty-state { padding: 55px 20px; color: var(--muted); text-align: center; }
    .empty-state strong { display: block; color: var(--white); font: 600 18px "Space Grotesk", sans-serif; }
    .empty-state p { margin-top: 7px; font-size: 12px; }

    /* Modal / toast / mobile nav */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(4,3,12,.75);
      backdrop-filter: blur(14px);
    }
    .modal {
      width: min(430px, 100%);
      padding: 25px;
      border: 1px solid var(--line-bright);
      border-radius: 20px;
      background: #121027;
      box-shadow: var(--shadow), 0 0 60px rgba(133,97,255,.18);
      animation: modal-in .25s ease both;
    }
    @keyframes modal-in { from { opacity: 0; transform: scale(.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .modal h2 { margin-top: 8px; font-size: 25px; }
    .modal p { margin-top: 7px; color: var(--muted); font-size: 12px; }
    .form { display: grid; gap: 13px; margin-top: 21px; }
    .field { display: grid; gap: 6px; }
    .field label { color: #d5d0e7; font-size: 11px; font-weight: 600; }
    .field input, .field textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: 0;
      color: var(--white);
      background: rgba(255,255,255,.045);
    }
    .field input:focus, .field textarea:focus { border-color: var(--line-bright); box-shadow: 0 0 0 3px rgba(169,140,255,.1); }
    .field textarea { min-height: 100px; resize: vertical; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .modal-close {
      float: right;
      width: 30px;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
    }
    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 30;
      max-width: min(360px, calc(100% - 40px));
      padding: 12px 15px;
      border: 1px solid var(--line-bright);
      border-radius: 12px;
      color: var(--white);
      background: #17122f;
      box-shadow: var(--shadow);
      font-size: 12px;
      animation: toast-in .25s ease both;
    }
    @keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .tour-backdrop, .command-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(3, 2, 12, .74);
      backdrop-filter: blur(14px);
    }
    .tour-card, .command-card {
      position: relative;
      width: min(540px, 100%);
      padding: 28px;
      overflow: hidden;
      border: 1px solid var(--line-bright);
      border-radius: 24px;
      background:
        radial-gradient(circle at 85% 15%, rgba(168,140,255,.22), transparent 12rem),
        #121027;
      box-shadow: var(--shadow), 0 0 70px rgba(133,97,255,.2);
      animation: modal-in .28s ease both;
    }
    .tour-card::before {
      content: "";
      position: absolute;
      width: 210px;
      height: 210px;
      top: -115px;
      right: -55px;
      border: 1px solid rgba(193,174,255,.25);
      border-radius: 50%;
      box-shadow: 0 0 26px rgba(168,140,255,.18);
    }
    .tour-step-icon {
      position: relative;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      margin: 21px 0 16px;
      border: 1px solid var(--line-bright);
      border-radius: 16px;
      color: var(--violet-bright);
      background: rgba(168,140,255,.1);
      font-size: 24px;
      box-shadow: 0 0 23px rgba(168,140,255,.16);
    }
    .tour-card h2 { position: relative; font-size: 29px; }
    .tour-card p { position: relative; max-width: 450px; margin-top: 10px; color: var(--muted); line-height: 1.7; }
    .tour-progress { display: flex; gap: 5px; margin-top: 23px; }
    .tour-progress i { width: 18px; height: 3px; border-radius: 9px; background: rgba(255,255,255,.14); }
    .tour-progress i.active { background: var(--violet-bright); box-shadow: 0 0 8px var(--violet); }
    .tour-actions { position: relative; display: flex; align-items: center; gap: 10px; margin-top: 25px; }
    .tour-actions .tour-skip { margin-right: auto; padding: 0; color: var(--dim); font-size: 11px; }
    .tour-actions .tour-back { border: 1px solid var(--line); color: var(--muted); background: transparent; }
    .command-card { width: min(600px, 100%); padding: 15px; }
    .command-search { width: 100%; padding: 14px 15px; border: 1px solid var(--line); border-radius: 12px; outline: 0; color: var(--white); background: rgba(255,255,255,.045); }
    .command-search:focus { border-color: var(--line-bright); box-shadow: 0 0 0 3px rgba(169,140,255,.1); }
    .command-list { display: grid; gap: 4px; margin-top: 12px; }
    .command-item { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid transparent; border-radius: 10px; color: var(--muted); background: transparent; text-align: left; }
    .command-item:hover, .command-item:focus { color: var(--white); border-color: var(--line); background: rgba(255,255,255,.055); outline: 0; }
    .command-item b { width: 24px; color: var(--violet-bright); text-align: center; }
    .mobile-nav {
      display: none;
      position: fixed;
      right: 10px;
      bottom: 10px;
      left: 10px;
      z-index: 10;
      grid-template-columns: repeat(5, 1fr);
      padding: 7px;
      border: 1px solid var(--line-bright);
      border-radius: 16px;
      background: rgba(13,11,29,.9);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }
    .mobile-nav button { padding: 8px 2px; border: 0; color: var(--muted); background: transparent; font-size: 10px; }
    .mobile-nav button span { display: block; margin-bottom: 2px; font-size: 16px; }
    .mobile-nav button.active { color: var(--violet-bright); }

    @media (max-width: 900px) {
      .app-shell { grid-template-columns: 74px minmax(0, 1fr); }
      .sidebar { align-items: center; padding-right: 9px; padding-left: 9px; }
      .sidebar .brand-name, .nav-label, .nav-button span:last-child, .mini-profile-copy { display: none; }
      .sidebar .brand { padding: 0; }
      .nav-button { justify-content: center; width: 48px; padding: 11px 0; }
      .mini-profile { padding: 7px; }
      .content-grid { grid-template-columns: 1fr; }
      .side-column { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .side-column > .card { min-width: 0; }
    }
    @media (max-width: 640px) {
      .portal-header { width: calc(100% - 28px); padding-top: 14px; }
      .portal-header .brand-name { font-size: 11px; }
      .portal-links { gap: 14px; }
      .portal-link { font-size: 11px; }
      .join-button { padding: 7px 15px; }
      .portal-main { width: calc(100% - 28px); padding-top: 25px; }
      .portal-content h1 { font-size: clamp(47px, 14vw, 82px); }
      .portal-tagline { margin: 20px 0 25px; font-size: 9px; letter-spacing: .18em; }
      .portal-actions { flex-direction: column; align-items: center; }
      .portal-actions button { width: min(260px, 100%); }
      .feature-strip { grid-template-columns: 1fr; gap: 12px; padding: 15px 0; }
      .portal-status { font-size: 8px; }
      .app-shell { display: block; }
      .sidebar { display: none; }
      .topbar { height: 65px; padding: 0 14px; }
      .mobile-menu { display: grid; }
      .page-heading h2 { font-size: 17px; }
      .page-heading p { display: none; }
      .search { display: none; }
      .content { padding: 21px 13px 90px; }
      .content-grid { display: block; }
      .side-column { display: grid; grid-template-columns: 1fr; margin-top: 16px; }
      .composer { padding: 13px; }
      .composer-tools { padding-left: 0; }
      .tool-button { padding-left: 5px; padding-right: 5px; }
      .post-card { padding: 14px; }
      .post-body, .post-actions { padding-left: 0; }
      .post-image { width: 100%; margin-left: 0; }
      .cards-grid { grid-template-columns: 1fr; }
      .hero-card { padding: 21px; }
      .profile-banner { min-height: 190px; padding: 18px; }
      .stats-card { padding: 12px 4px; }
      .stat { padding: 2px 6px; }
      .stat strong { font-size: 18px; }
      .stat span { font-size: 8px; }
      .mobile-nav { display: grid; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    /* Reference-led visual pass: denser, bluer, and more like a command center. */
    :root {
      --void: #040811;
      --void-soft: #07101e;
      --panel: rgba(8, 17, 31, .88);
      --panel-solid: #091321;
      --panel-light: rgba(15, 30, 52, .86);
      --line: rgba(122, 164, 214, .18);
      --line-bright: rgba(103, 176, 255, .62);
      --white: #f3f7ff;
      --muted: #8e9eb6;
      --dim: #52647e;
      --violet: #7167ff;
      --violet-bright: #9c9cff;
      --blue: #6cd7ff;
      --green: #7ee6c2;
      --radius: 14px;
    }
    body {
      background:
        radial-gradient(circle at 52% 12%, rgba(43, 77, 151, .24), transparent 28rem),
        radial-gradient(circle at 92% 88%, rgba(72, 36, 152, .13), transparent 24rem),
        #040811;
    }
    body::before {
      background:
        linear-gradient(rgba(75, 112, 169, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(75, 112, 169, .045) 1px, transparent 1px),
        radial-gradient(circle at 52% 30%, rgba(67, 99, 212, .20), transparent 30rem),
        #040811;
      background-size: 42px 42px, 42px 42px, auto, auto;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.75), transparent 90%);
    }
    body::after {
      opacity: .28;
      background-size: 280px 220px, 360px 290px, 470px 390px;
    }
    .portal {
      background:
        radial-gradient(ellipse at 50% 48%, rgba(40, 81, 191, .19), transparent 25rem),
        radial-gradient(ellipse at 50% 50%, transparent 0 16rem, rgba(49, 115, 235, .08) 16.1rem 16.2rem, transparent 16.3rem),
        linear-gradient(135deg, #040811 0%, #071222 52%, #03060c 100%);
    }
    .portal::after {
      content: "";
      position: absolute;
      inset: 12% 21%;
      border: 1px solid rgba(77, 148, 255, .12);
      border-radius: 50%;
      transform: rotate(-14deg) scaleY(.35);
      box-shadow: 0 0 90px rgba(46, 116, 255, .12);
      pointer-events: none;
    }
    .portal-header {
      width: 100%;
      padding: 20px clamp(18px, 4vw, 56px);
      border-bottom-color: rgba(119, 159, 211, .17);
    }
    .portal-header .brand-mark,
    .sidebar .brand-mark { color: var(--blue); }
    .portal-content {
      width: min(900px, 100%);
      padding: 42px 20px;
      text-align: left;
      overflow: visible;
    }
    @keyframes sevenPulse {
      0%, 100% { opacity: .72; transform: skewX(-8deg) scale(.98); }
      50% { opacity: 1; transform: skewX(-8deg) scale(1.02); }
    }
    @keyframes sevenOrbit {
      from { transform: rotate(-18deg) scaleY(.42); }
      to { transform: rotate(342deg) scaleY(.42); }
    }
    @keyframes sevenShimmer {
      0%, 100% { background-position: 0% 50%; filter: drop-shadow(0 0 9px rgba(151, 143, 255, .9)) drop-shadow(0 0 24px rgba(84, 172, 255, .45)); }
      50% { background-position: 100% 50%; filter: drop-shadow(0 0 14px rgba(190, 181, 255, 1)) drop-shadow(0 0 34px rgba(84, 172, 255, .72)); }
    }
    @keyframes sevenRayA {
      0%, 100% { opacity: .3; transform: translate(-50%, -50%) rotate(17deg) scaleX(.72); }
      50% { opacity: .95; transform: translate(-50%, -50%) rotate(17deg) scaleX(1.16); }
    }
    @keyframes sevenRayB {
      0%, 100% { opacity: .2; transform: translate(-50%, -50%) rotate(-17deg) scaleX(.8); }
      50% { opacity: .68; transform: translate(-50%, -50%) rotate(-17deg) scaleX(1.2); }
    }
    .portal-content::before {
      content: "7";
      position: absolute;
      top: -4.9rem;
      left: 18%;
      color: rgba(118, 150, 255, .06);
      font: 700 clamp(280px, 46vw, 540px)/1 "Space Grotesk", sans-serif;
      pointer-events: none;
      text-shadow: 0 0 70px rgba(67, 126, 255, .16), 0 0 130px rgba(132, 92, 255, .12);
      transform: skewX(-8deg);
      animation: sevenPulse 4.8s ease-in-out infinite;
    }
    .portal-content::after {
      content: "";
      position: absolute;
      width: min(610px, 74vw);
      aspect-ratio: 1;
      top: -2.2rem;
      left: 9%;
      border: 1px solid rgba(168, 148, 255, .24);
      border-radius: 50%;
      transform: rotate(-18deg) scaleY(.42);
      box-shadow: 0 0 38px rgba(111, 92, 255, .16), inset 0 0 35px rgba(111, 92, 255, .08);
      pointer-events: none;
      animation: sevenOrbit 18s linear infinite;
    }
    .portal-content h1 {
      position: relative;
      max-width: 840px;
      font-size: clamp(60px, 10.5vw, 132px);
      letter-spacing: -.11em;
      line-height: 1;
      overflow: visible;
      text-shadow: 0 0 48px rgba(75, 139, 255, .25);
    }
    .portal-content h1 span {
      color: #84dfff;
      background: linear-gradient(120deg, #f2fdff 0%, #8fe6ff 27%, #6f72ff 68%, #d9d0ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .portal-content h1 .hero-line {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 0;
      margin-bottom: -.45rem;
    }
    .portal-content h1 .hero-seven {
      position: relative;
      display: block;
      width: clamp(150px, 22vw, 260px);
      height: clamp(150px, 22vw, 260px);
      margin: -.15em 0 0;
      color: transparent;
      line-height: 1;
      transform: none;
      z-index: 1;
      filter: drop-shadow(0 0 8px rgba(151, 143, 255, .95)) drop-shadow(0 0 26px rgba(84, 172, 255, .55));
      animation: sevenShimmer 4.2s ease-in-out infinite;
    }
    .portal-content h1 .hero-seven svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .portal-content h1 .hero-seven .crystal-edge {
      fill: url(#crystalEdge);
      stroke: rgba(233, 249, 255, .9);
      stroke-width: 1.2;
      stroke-linejoin: bevel;
    }
    .portal-content h1 .hero-seven .crystal-facet-a { fill: url(#crystalFacetA); }
    .portal-content h1 .hero-seven .crystal-facet-b { fill: url(#crystalFacetB); }
    .portal-content h1 .hero-seven .crystal-facet-c { fill: url(#crystalFacetC); }
    .portal-content h1 .hero-seven .crystal-highlight {
      fill: none;
      stroke: rgba(255, 255, 255, .92);
      stroke-width: 2;
      stroke-linecap: round;
      opacity: .82;
    }
    .portal-content h1 .hero-seven::before,
    .portal-content h1 .hero-seven::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1.8em;
      height: .025em;
      background: linear-gradient(90deg, transparent, rgba(223, 236, 255, .9), transparent);
      box-shadow: 0 0 12px rgba(169, 189, 255, .8);
      transform: translate(-50%, -50%) rotate(17deg);
      opacity: .8;
      z-index: -1;
      animation: sevenRayA 2.8s ease-in-out infinite;
    }
    .portal-content h1 .hero-seven::after {
      width: 2.2em;
      transform: translate(-50%, -50%) rotate(-17deg);
      opacity: .42;
      animation: sevenRayB 3.6s ease-in-out .35s infinite;
    }
    .portal-content h1 .hero-th {
      display: inline-block;
      margin: 0 0 .28em -.85em;
      font-size: .59em;
      letter-spacing: -.04em;
      vertical-align: baseline;
    }
    .portal-tagline {
      position: relative;
      margin-top: 21px;
      color: #a9c5e6;
      letter-spacing: .24em;
    }
    .portal-actions { position: relative; justify-content: flex-start; }
    .primary-button {
      color: #04101d;
      background: linear-gradient(135deg, #e8fbff, #83dfff);
      box-shadow: 0 0 26px rgba(84, 202, 255, .22);
    }
    .ghost-button { border-color: rgba(108, 190, 255, .58); }
    .portal-footer {
      width: 100%;
      padding: 0 clamp(18px, 4vw, 56px) 18px;
    }
    .feature-strip {
      grid-template-columns: repeat(3, minmax(0, 220px));
      justify-content: start;
      gap: 28px;
      border-top-color: rgba(119, 159, 211, .18);
      border-bottom-color: rgba(119, 159, 211, .12);
    }
    .feature { justify-content: flex-start; color: #8ea7c8; }
    .feature i { border-color: var(--blue); }

    .app-shell {
      grid-template-columns: 210px minmax(0, 1fr);
      background:
        linear-gradient(90deg, rgba(3, 7, 14, .88), transparent 28%),
        radial-gradient(circle at 62% 8%, rgba(32, 94, 188, .14), transparent 32rem);
    }
    .sidebar {
      gap: 24px;
      padding: 20px 12px 14px;
      border-right-color: rgba(105, 151, 209, .19);
      background: rgba(3, 9, 18, .9);
    }
    .sidebar .brand { padding: 0 11px; }
    .nav-button {
      padding: 10px 12px;
      border-radius: 9px;
    }
    .nav-button:hover, .nav-button.active {
      border-color: rgba(84, 170, 255, .42);
      background: linear-gradient(90deg, rgba(72, 151, 235, .18), rgba(72, 151, 235, .03));
      box-shadow: inset 3px 0 0 #62d8ff;
    }
    .nav-button.active .nav-icon { color: var(--blue); }
    .mini-profile {
      border-color: rgba(105, 151, 209, .22);
      background: linear-gradient(135deg, rgba(20, 43, 72, .68), rgba(11, 20, 35, .62));
    }
    .topbar {
      height: 70px;
      padding: 0 clamp(18px, 3vw, 38px);
      border-bottom-color: rgba(105, 151, 209, .19);
      background: rgba(4, 10, 20, .68);
    }
    .page-heading h2 { font-size: 18px; letter-spacing: -.02em; }
    .search {
      width: min(285px, 28vw);
      border-radius: 8px;
      border-color: rgba(105, 151, 209, .25);
      background: rgba(9, 23, 40, .74);
    }
    .icon-button {
      border-color: rgba(105, 151, 209, .25);
      border-radius: 8px;
      background: rgba(9, 23, 40, .74);
    }
    .profile-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 3px 9px 3px 4px;
      border: 1px solid rgba(105, 151, 209, .25);
      border-radius: 9px;
      color: #d7e7f9;
      background: rgba(9, 23, 40, .74);
      font-size: 10px;
    }
    .profile-chip:hover { border-color: rgba(108, 215, 255, .58); }
    .content {
      width: min(1280px, 100%);
      padding: 24px clamp(18px, 3vw, 38px) 90px;
    }
    .content-grid { gap: 15px; }
    .stack { gap: 13px; }
    .card {
      border-radius: 13px;
      border-color: rgba(105, 151, 209, .2);
      background: linear-gradient(145deg, rgba(12, 27, 46, .9), rgba(6, 14, 26, .92));
      box-shadow: 0 18px 40px rgba(0, 0, 0, .22), inset 0 1px 0 rgba(188, 222, 255, .035);
    }
    .card:hover {
      border-color: rgba(105, 191, 255, .35);
    }
    .composer { padding: 15px; }
    .composer-input { border-color: rgba(105, 151, 209, .22); background: rgba(2, 8, 17, .48); }
    .section-tabs {
      gap: 23px;
      padding-bottom: 10px;
      border-bottom-color: rgba(105, 151, 209, .16);
    }
    .section-tab.active::after { background: var(--blue); box-shadow: 0 0 11px rgba(108, 215, 255, .72); }
    .post-card { padding: 16px; }
    .post-body p { color: #c6d4e8; }

  <script>
    (() => {
      "use strict";

      const SUPABASE_URL = "https://xgxntpbeorjfocprauxs.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_aaYXL5-Q6U46K2QxTypiig__8A5GVUL";
      const db = window.supabase?.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      const $ = (selector, scope = document) => scope.querySelector(selector);
      const $$ = (selector, scope = document) => [...scope.querySelectorAll(selector)];
      const escapeHTML = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[char]));
      const initials = (value = "ARMY") => value.split(/[\s_.-]+/).filter(Boolean).slice(0, 2).map((part) => part[0]).join("").toUpperCase() || "AM";
      const formatTime = (value) => {
        if (!value) return "just now";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        return new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" }).format(date);
      };
      const slug = (value) => String(value || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60);

      const state = {
        view: "flow",
        filter: "Latest",
        query: "",
        user: null,
        profile: null,
        profiles: [],
        communities: [],
        communityMembers: [],
        posts: [],
        comments: [],
        reactions: [],
        messages: [],
        notifications: [],
        follows: [],

        blocks: [],

        composerFile: null,
        typingUsers: {},
        presence: {},
        capabilities: {},
        realtimeChannel: null,
        loading: false
      };

      const pageMeta = {
        flow: ["Flow", "Live signals from the constellation."],
        constellation: ["Constellation", "Communities that exist in your database."],
        discover: ["Discover", "Real ARMY accounts and current activity."],
        signal: ["Signal", "Notifications received from the database."],
        archive: ["Archive", "Saved records from your account."],
        events: ["Events", "Events configured in the connected database."],
        messages: ["Messages", "Live messages from connected channels."],
        profile: ["Profile", "Your identity from the connected database."]
      };
      const tourSteps = [
        ["◌", "FLOW", "Your live social feed. Create posts, react, comment, save, and share records that are stored in Supabase."],
        ["✧", "CONSTELLATION", "Join communities returned by the database. Membership changes are written to Supabase and reflected in realtime."],
        ["⌕", "DISCOVER", "Find real profiles and activity visible to your account. No directory members are invented when the database is empty."],
        ["◈", "SIGNAL", "See notifications delivered to your account, including reactions, follows, messages, and community activity when those records exist."],
        ["▱", "ARCHIVE", "Saved content comes from the bookmarks table. If that table is not configured, the app tells you instead of simulating saved posts."],
        ["◷", "EVENTS", "Events are database-driven. Dates and attendee counts only appear after an events table is connected."],
        ["◇", "MISSIONS", "Mission progress, XP, and achievements need their corresponding Supabase tables; this app will show an honest empty state until they exist."],
        ["⌁", "MESSAGES", "Read and send messages through connected message records. Realtime updates arrive through the Supabase channel."],
        ["⌕", "SEARCH", "Use the global search field to filter live signals. Press Cmd/Ctrl + K to open the command panel."],
        ["◎", "PROFILE", "Your name, role, bio, posts, and memberships come from your authenticated Supabase profile."],
        ["✦", "ARMY ORBIT", "Your profile is the center of the orbit; surrounding activity is based on your real communities, follows, and notifications."],
        ["◌", "DIMENSION PULSE", "The feed pulse reflects records currently returned by the database, not fabricated online counts."],
        ["♢", "COMMUNITIES & ROLES", "Role labels are read from public.profiles. Permission checks must remain enforced by Supabase RLS and database policies."],
        ["◇", "PROJECTS", "Projects can be connected later through a projects table. Until then, no sample projects are shown."],
        ["⚙", "SETTINGS & PRIVACY", "Edit your stored profile, manage your session, replay this tour, and keep account controls behind real authentication."]
      ];

      function toast(message, isError = false) {
        const root = $("#toast-root");
        root.innerHTML = `<div class="toast" style="${isError ? "border-color:rgba(255,157,169,.7)" : ""}">${escapeHTML(message)}</div>`;
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => { root.innerHTML = ""; }, 3600);
      }

      async function queryRows(table, options = {}) {
        if (!db) return { data: [], error: new Error("Supabase client could not load.") };
        let query = db.from(table).select(options.select || "*");
        if (options.order) query = query.order(options.order, { ascending: options.ascending ?? false });
        if (options.limit) query = query.limit(options.limit);
        if (options.eq) Object.entries(options.eq).forEach(([column, value]) => { query = query.eq(column, value); });
        return query;
      }

      async function readTable(table, options = {}) {
        const result = await queryRows(table, options);
        if (result.error) {
          state.capabilities[table] = false;
          return [];
        }
        state.capabilities[table] = true;
        return result.data || [];
      }

      function profileFor(id) {
        return state.profiles.find((profile) => String(profile.id) === String(id)) || null;
      }

      function displayName(profile, fallback = "ARMY") {
        return profile?.display_name || profile?.username || fallback;
      }

      function currentName() {
        return displayName(state.profile, state.user?.email?.split("@")[0] || "ARMY");
      }

      function currentAvatar() {
        return state.profile?.avatar_color || "gold";
      }

      function avatarMarkup(profile, size = "", fallback = "ARMY") {
        const image = profile?.avatar_url || profile?.avatar || profile?.profile_image_url || profile?.photo_url;
        const classes = `avatar ${size} ${escapeHTML(profile?.avatar_color || "blue")}${image ? " has-image" : ""}`;
        return `<span class="${classes}">${image ? `<img src="${escapeHTML(image)}" alt="" />` : escapeHTML(initials(displayName(profile, fallback)))}</span>`;
      }

      function currentAvatarMarkup(size = "") {
        return avatarMarkup(state.profile, size, currentName());
      }

      function isOnline(id) {
        return Boolean(id && state.presence?.[id]);
      }

      function presenceMarkup(id) {
        return `<span class="presence-dot ${isOnline(id) ? "online" : ""}" title="${isOnline(id) ? "Online" : "Offline"}"></span>`;
      }

      function isAdmin() {
        return state.profile?.role === "admin";
      }

      function canCreateCommunity() {
        return isAdmin() || state.profile?.is_featured === true || state.profile?.can_create_community === true;
      }

      function mainStage() {
        return state.communities.find((community) => community.is_main === true || community.is_main === "true")
          || state.communities.find((community) => /main\s*stage/i.test(community.name || ""));
      }

      function hydratePost(row) {
        const authorId = row.author_id || row.user_id || row.owner_id || row.profile_id;
        const author = profileFor(authorId);
        const text = row.content ?? row.body ?? row.text ?? row.caption ?? "";
        const postReactions = state.reactions.filter((reaction) => String(reaction.post_id || reaction.target_id || reaction.content_id) === String(row.id));
        const likes = postReactions.filter((reaction) => !reaction.type || reaction.type === "like" || reaction.reaction_type === "like").length;
        const liked = postReactions.some((reaction) => String(reaction.user_id) === String(state.user?.id) && (!reaction.type || reaction.type === "like" || reaction.reaction_type === "like"));
        const saved = state.bookmarks.some((bookmark) => String(bookmark.post_id || bookmark.target_id || bookmark.content_id) === String(row.id));
        const comments = state.comments.filter((comment) => String(comment.post_id || comment.target_id) === String(row.id)).length;
        const linkedText = escapeHTML(text).replace(/(^|\s)(@[\w.-]+)/g, (match, prefix, mention) => {
          const mentioned = state.profiles.find((profile) => String(profile.username || "").toLowerCase() === mention.slice(1).toLowerCase());
          return mentioned ? `${prefix}<a class="mention-link" href="#profile-${escapeHTML(mentioned.id)}" data-profile="${escapeHTML(mentioned.id)}">${escapeHTML(mention)}</a>` : match;
        }).replace(/(#[-\w]+)/g, '<span class="tag">$1</span>');
        return {
          id: row.id,
          authorId,
          author: displayName(author, row.author_name || "ARMY"),
          role: author?.role === "admin" ? "ADMIN" : author?.role === "featured_army" ? "FEATURED ARMY" : "ARMY",
          initials: initials(displayName(author, row.author_name || "ARMY")),
          avatar: author?.avatar_color || "blue",
          time: formatTime(row.created_at || row.updated_at),
          text: linkedText,
          likes,
          comments,
          liked,
          saved,
          image: row.image_url || row.media_url || row.cover_url || "",
          pinned: row.is_pinned === true || row.pinned === true,
          raw: row
        };
      }

      async function loadLiveData() {
        if (!state.user || !db) return;
        state.loading = true;
        const results = await Promise.all([
          readTable("profiles", { order: "created_at", ascending: false, limit: 100 }),
          readTable("communities", { order: "created_at", ascending: false, limit: 100 }),
          readTable("community_members", { limit: 500 }),
          readTable("posts", { order: "created_at", ascending: false, limit: 100 }),
          readTable("comments", { limit: 500 }),
          readTable("reactions", { limit: 500 }),
          readTable("messages", { order: "created_at", ascending: true, limit: 100 }),
          readTable("notifications", { order: "created_at", ascending: false, limit: 100 }),
          readTable("user_follows", { limit: 500 }),
          readTable("bookmarks", { limit: 500 }),
          readTable("bookmark_collections", { limit: 100 }),
          readTable("drafts", { limit: 100 }),
          readTable("blocks", { limit: 500 }),
          readTable("events", { limit: 100 }),
          readTable("event_members", { limit: 500 })
        ]);
        [state.profiles, state.communities, state.communityMembers, state.posts, state.comments, state.reactions, state.messages, state.notifications, state.follows, state.bookmarks, state.collections, state.drafts, state.blocks, state.events, state.eventMembers] = results;
        state.notifications = state.notifications.filter((notification) => {
          const recipient = notification.user_id || notification.recipient_id || notification.to_user_id;
          return !recipient || String(recipient) === String(state.user.id);
        });
        state.drafts = state.drafts.filter((draft) => !draft.user_id || String(draft.user_id) === String(state.user.id));
        state.blocks = state.blocks.filter((block) => String(block.blocker_id || block.user_id || block.owner_id) === String(state.user.id));
        state.reports = isAdmin() ? await readTable("reports", { limit: 100 }) : [];
        state.posts = state.posts.filter((post) => {
          const authorId = post.author_id || post.user_id || post.owner_id || post.profile_id;
          return !state.blocks.some((block) => String(block.blocked_id || block.target_user_id || block.blocked_user_id) === String(authorId));
        });
        state.profile = profileFor(state.user.id) || state.profile;
        state.loading = false;
        render();
      }

      function connectRealtime() {
        if (!db || state.realtimeChannel) return;
        const tables = ["profiles", "communities", "community_members", "posts", "comments", "reactions", "messages", "notifications", "user_follows", "drafts", "events", "event_members", "blocks", "reports"];
        state.realtimeChannel = db.channel("7th-dimension-live", { config: { presence: { key: state.user.id }, broadcast: { self: false } } });
        tables.forEach((table) => {
          state.realtimeChannel.on("postgres_changes", { event: "*", schema: "public", table }, () => loadLiveData());
        });
        state.realtimeChannel.on("presence", { event: "sync" }, () => {
          const presence = state.realtimeChannel.presenceState();
          state.presence = Object.fromEntries(Object.keys(presence).map((key) => [key, true]));
          if (state.view === "profile" || state.view === "discover" || state.view === "messages") render();
        });
        state.realtimeChannel.on("broadcast", { event: "typing" }, ({ payload }) => {
          if (!payload?.user_id || String(payload.user_id) === String(state.user.id)) return;
          if (payload.typing) state.typingUsers[payload.user_id] = payload.username || "Someone";
          else delete state.typingUsers[payload.user_id];
          if (state.view === "messages") render();
        });
        state.realtimeChannel.subscribe((status) => {
          if (status === "SUBSCRIBED") state.realtimeChannel.track({ user_id: state.user.id, username: currentName(), online_at: new Date().toISOString() });
          if (status === "CHANNEL_ERROR") toast("Realtime is unavailable for the current Supabase table publication.", true);
        });
      }

      async function enterWithUser(user) {
        state.user = user;
        const profileResult = await db.from("profiles").select("*").eq("id", user.id).maybeSingle();
